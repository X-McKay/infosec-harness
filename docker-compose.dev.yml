services:
  api:
    runtime: runc
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - harness
    - api
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    volumes:
    - ./src:/app/src:ro
    environment:
      PYTHONPATH: /app/src
  web:
    runtime: runc
    logging: *id001
    build: !reset null
    image: node:22.23.3-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    working_dir: /app
    command:
    - sh
    - -c
    - npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
    - ./ui:/app:ro
    - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://api:8000
    ports: []
  egress-proxy:
    runtime: runc
    logging: *id001
    networks:
      default: {}
      build-egress:
        aliases:
        - egress-proxy
        ipv4_address: ${HARNESS_BUILD_EGRESS_HOST_IP}
volumes:
  web_node_modules: null
networks:
  build-egress:
    name: ${HARNESS_BUILD_EGRESS_NETWORK}
    internal: true
    ipam:
      config:
      - subnet: ${HARNESS_BUILD_EGRESS_SUBNET}
