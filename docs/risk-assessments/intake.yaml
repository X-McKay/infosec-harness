# Generated by scripts/gen_risk_assessments.py from scripts/risk_scenarios.py.
# Edit the scenario library, not this file; tests/development/test_risk_assessments.py asserts
# they agree. See agent-playbook 13-risk-assessment.md for the method.
schema_version: 1
assessment:
  agent: intake
  agent_version: 1.0.4
  assessment_version: 1.0.0
  status: draft
  assessed_at: '2026-09-26'
  review_by: '2027-03-26'
  prepared_by: appsec
  approved_by: []
scope:
  intended_use: Triage pre-identified vulnerability findings for exploitability by building the
    target repository and running a targeted unit-test probe in an isolated sandbox, returning potentially_exploitable,
    likely_not_exploitable, or inconclusive with cited evidence. This assessment covers the intake
    agent's contribution.
  prohibited_uses:
  - Scanning for previously unknown vulnerabilities.
  - Running probes against production systems, live services, or any host outside the sandbox.
  - Writing code changes, fixes, or any modification to the repository under triage.
  - Treating a verdict as an authoritative security sign-off without human review.
  - Processing a repository whose source may not be sent to the configured model backend.
  users:
  - application-security-engineers
  - vulnerability-management
  affected_parties:
  - the operating organization
  - customers whose source is triaged
  - application teams receiving verdicts
  environments:
  - local
  - production
  jurisdictions:
  - replace-with-applicable-jurisdictions
  execution_class: durable
dimension_review:
  financial:
    status: applicable
    rationale: Model spend scales with findings triaged, and an unbounded loop spends without result.
  operational:
    status: applicable
    rationale: A stalled or looping run occupies worker capacity and delays the triage queue.
  reputational:
    status: applicable
    rationale: A confident verdict that turns out wrong — in either direction — damages trust in
      the triage output and in the team that operates it.
  legal:
    status: applicable
    rationale: Source under triage is customer material subject to contractual handling terms, and
      a missed exploitable vulnerability may carry disclosure obligations.
  security:
    status: applicable
    rationale: The system executes untrusted code by design and reasons over attacker-influenced
      text; this is the dominant dimension.
  privacy:
    status: applicable
    rationale: Unfixed vulnerability detail and customer source are sent to a model provider.
  regulatory:
    status: not_applicable
    rationale: The system makes no decision about a person and is not used in a regulated decision-making
      context. Revisit if it is ever applied to findings whose disclosure carries statutory timelines.
  human_impact_safety:
    status: not_applicable
    rationale: No output affects an individual's rights, opportunities, or physical safety. Revisit
      if the harness is ever pointed at software with a safety function.
regulatory_screen:
  prohibited_use: false
  applicable_regimes: []
  required_reviews:
  - security
  - privacy
  governance_floors: []
  notes: Jurisdictions and contractual data-handling terms are deployment-specific and must be confirmed
    against the configured model backend before approval. This screen does not establish legal compliance.
classification:
  governance_tier: medium
  maximum_inherent_tier: medium
  maximum_residual_tier: medium
  decision: go
  rationale: Every scenario reaching this agent has a verified control set and a residual tier of
    medium or below. It does not influence what code the sandbox executes.
scenarios:
- id: RISK-SEC-002
  title: Repository content is treated as instructions
  status: open
  statement: Because repository content, finding text, and probe output all reach the model, the
    agent could follow instructions embedded in that content, causing a misdirected investigation
    and an unreliable triage conclusion for the operating organization.
  primary_dimension: security
  secondary_dimensions:
  - operational
  - reputational
  affected_parties:
  - the operating organization
  - application teams receiving verdicts
  affected_assets:
  - triage conclusions
  - engineering time
  causes:
  - a source file or README contains text addressed to an automated reviewer
  - a finding description is attacker-influenced
  preconditions:
  - untrusted text reaches the model context
  consequences:
  - the agent investigates the wrong location or reports a fabricated conclusion
  - remediation effort is misdirected
  inherent:
    impact: 2
    likelihood: 3
    tier: medium
    confidence: medium
    rationale: Injected text is plausible in any real repository, but the blast radius is a wrong
      triage conclusion rather than an action, because the agents have no write tools.
  controls:
  - id: CTRL-INJ-001
    type: preventive
    description: Every prompt labels repository content, finding text, and probe output as untrusted
      data and forbids following instructions found in it.
    owner: appsec
    evidence:
    - tests/runtime/test_render.py
    effectiveness: implemented
  - id: CTRL-INJ-002
    type: preventive
    description: 'The capability allowlist exposes no write tool at all: injected text has no consequential
      operation to reach, only file reads and skill loads.'
    owner: appsec
    evidence:
    - tests/agents/test_agents.py
    - src/infosec_harness/agents/registry.py
    effectiveness: verified
  - id: CTRL-FN-001
    type: preventive
    description: Exploitability is decided by an explicit oracle marker carrying a run nonce, detected
      deterministically in code — never from a test passing, and never from the model asserting
      it.
    owner: appsec
    evidence:
    - tests/runtime/test_sandbox.py
    - src/infosec_harness/sandbox/docker.py
    effectiveness: verified
  - id: CTRL-FN-002
    type: preventive
    description: 'A deterministic validator rejects any verdict the recorded facts do not support:
      potentially_exploitable requires the oracle to have fired, and likely_not_exploitable requires
      either a valid negative that reached the precondition or an evidenced unreachable sink.'
    owner: appsec
    evidence:
    - tests/agents/test_validators.py
    - tests/runtime/test_graph.py
    effectiveness: verified
  residual:
    impact: 2
    likelihood: 2
    tier: medium
    confidence: medium
    rationale: 'The decisive control is structural rather than textual: there is no consequential
      tool for injected text to reach, and a claim of exploitability is rejected unless a deterministic
      oracle fired. Prompt-level framing alone would not earn this.'
  treatment: mitigate
  owner: appsec
  eval_cases:
  - corpus-all-languages
  indicators:
  - verdict_contract_rejection_count
  alerts:
  - a sustained rise in verdict contract rejections
  runbook: docs/runbooks/triage-quality.md
- id: RISK-OPS-001
  title: Unbounded execution consumes budget without producing a verdict
  status: open
  statement: Because agents retry and repair on failure, the agent could loop without converging,
    causing uncontrolled model spend and a stalled triage queue for the operating organization.
  primary_dimension: financial
  secondary_dimensions:
  - operational
  affected_parties:
  - the operating organization
  affected_assets:
  - model spend
  - worker capacity
  - the triage queue
  causes:
  - a repair loop re-runs against an outcome that cannot change
  - an activity retry policy is absent and inherits unlimited attempts
  - an output contract the model cannot satisfy exhausts retries repeatedly
  preconditions:
  - a triage run starts
  consequences:
  - spend grows without a corresponding verdict
  - a workflow occupies a worker slot indefinitely
  inherent:
    impact: 2
    likelihood: 3
    tier: medium
    confidence: high
    rationale: 'Observed repeatedly: an offline stub that fabricated a clean probe run drove every
      case to its repair limit with context growing from 8.8k to 24k tokens, and two activity paths
      inherited Temporal''s unlimited retries.'
  controls:
  - id: CTRL-OPS-001
    type: preventive
    description: Each agent declares a per-run ceiling on model requests, tool calls, tokens, and
      cost, enforced through UsageLimits in both the local and durable paths.
    owner: appsec
    evidence:
    - tests/agents/test_budgets.py
    effectiveness: verified
  - id: CTRL-OPS-002
    type: preventive
    description: All four retry layers are bounded and their product is asserted, so a deterministic
      failure cannot retry indefinitely.
    owner: appsec
    evidence:
    - tests/agents/test_retry_bounds.py
    effectiveness: verified
  - id: CTRL-OPS-003
    type: recovery
    description: A failure on one finding is recorded as inconclusive/error and the batch continues;
      in the durable path each finding is its own child workflow.
    owner: appsec
    evidence:
    - tests/runtime/test_graph.py
    effectiveness: verified
  - id: CTRL-OPS-004
    type: detective
    description: Tokens, cache hits, and estimated cost are recorded per agent invocation and persisted
      with the run, and emitted as span attributes.
    owner: appsec
    evidence:
    - tests/runtime/test_telemetry.py
    - tests/persistence/test_persistence.py
    effectiveness: verified
  residual:
    impact: 2
    likelihood: 1
    tier: low
    confidence: high
    rationale: 'Every layer now has an asserted ceiling: per-run UsageLimits, a bounded product
      across the four retry layers, and per-finding containment so one failure cannot consume a
      batch.'
  treatment: mitigate
  owner: appsec
  eval_cases:
  - corpus-all-languages
  indicators:
  - budget_exhausted_count
  - average_cost_per_finding
  - p95_model_requests
  alerts:
  - budget exhaustion on more than a small fraction of findings
  runbook: docs/runbooks/cost-and-capacity.md
- id: RISK-PRIV-001
  title: Customer source is sent to an endpoint without the required terms
  status: open
  statement: Because the model backend is deployment configuration, the agent could send customer
    source and unfixed vulnerability detail to a provider that lacks the required data-processing
    terms, causing confidentiality and contractual harm to customers and the operating organization.
  primary_dimension: privacy
  secondary_dimensions:
  - legal
  - security
  - reputational
  affected_parties:
  - customers whose code is triaged
  - the operating organization
  affected_assets:
  - customer source
  - unfixed vulnerability detail
  causes:
  - a backend base_url is pointed at an unapproved endpoint
  - a deployment inherits a test endpoint configuration
  preconditions:
  - an agent run sends repository content to a model
  consequences:
  - source and exploitability detail are disclosed outside the trust boundary
  - contractual or regulatory obligations are breached
  inherent:
    impact: 3
    likelihood: 2
    tier: medium
    confidence: medium
    rationale: Sending source to a model is intrinsic to the design, so the scenario turns on whether
      the endpoint is an approved one — a configuration error, not a rare event.
  controls:
  - id: CTRL-PRIV-001
    type: preventive
    description: The model backend and endpoint are declarative config in config/models.yaml with
      no secrets, reviewed like code; a self-hosted OpenAI-spec endpoint is supported so source
      need not leave the deployment's trust boundary.
    owner: appsec
    evidence:
    - config/models.yaml
    - tests/agents/test_agents.py
    effectiveness: implemented
  residual:
    impact: 3
    likelihood: 2
    tier: medium
    confidence: medium
    rationale: The endpoint is reviewable declarative config and a self-hosted backend is supported,
      but nothing in the system verifies that a configured endpoint is an approved one, so this
      earns no likelihood reduction. Deployment-time control of config/models.yaml is the operator's
      responsibility.
  treatment: mitigate
  owner: appsec
  eval_cases: []
  indicators:
  - resolved_model_backend
  - resolved_model_endpoint
  alerts:
  - a model backend resolving to an endpoint outside the approved set
  runbook: docs/runbooks/data-handling.md
acceptance:
  accountable_role: appsec-risk-owner
  accepted_scenarios: []
  conditions: []
  expires_at: '2027-03-26'
  rationale: Not yet accepted. Awaiting sign-off by the named risk owner; no conditions outstanding.
assumptions:
- The repository under triage is untrusted; its build scripts and tests may be hostile.
- Probes run with no network egress and are confined to the sandbox workdir.
- config/models.yaml is controlled at deployment time and reviewed like code.
- 'No agent has a write tool: the capability allowlist exposes reads and skill loads.'
open_questions:
- Which jurisdictions and contractual terms apply to the configured model backend?
- What false-negative rate is acceptable once measured with the sandbox enabled?
