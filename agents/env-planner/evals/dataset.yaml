version: "1"
# Scored on (base-image family / test runner). Those two choices decide whether the build can
# produce a runnable test at all; the rest of the spec is detail the build loop can repair.
# The stack fingerprint is derived from the repo by detect_stack, as the graph does it.
#
# One case per corpus ecosystem, because the wrong answer here is almost always the *other*
# ecosystem's recipe: an agent that has drifted towards its most common input answers
# python/pytest for a pom.xml. The last two cases hand over a repo_profile that names no
# language or framework at all (recon can legitimately fail to identify either), so the plan
# has to come from the manifests the agent reads rather than from prose it can copy — the
# stub's own fallback for an unrecognised stack is debian:bookworm-slim + `sh {test_file}`,
# which scores `other/other`.
cases:
  - name: python-pip-pytest
    repo: eval-corpus/python/sqli/vulnerable
    payload:
      repo_profile: {summary: "small python app", primary_language: python,
                     test_framework: pytest, test_layout: "tests/"}
    expected: python/pytest
  - name: javascript-npm-jest
    repo: eval-corpus/javascript/xss/vulnerable
    payload:
      repo_profile: {summary: "small node app", primary_language: javascript,
                     test_framework: jest, test_layout: "test/"}
    expected: node/jest
  - name: java-maven-junit5
    # pom.xml declares junit-jupiter 5.10.2 and compiler release 17, so the plan must be a
    # Maven one; `mvn test` is also the only runner that can execute a single JUnit class.
    repo: eval-corpus/java/sqli/vulnerable
    payload:
      repo_profile: {summary: "small JDBC data-access library", primary_language: java,
                     test_framework: junit5, test_layout: "src/test/java/"}
    expected: maven/mvn
  - name: perl-cpanm-prove
    # cpanfile requires DBI; nothing here is installable with pip or npm.
    repo: eval-corpus/perl/sqli/vulnerable
    payload:
      repo_profile: {summary: "small Perl DBI data-access module", primary_language: perl,
                     test_framework: "Test::More", test_layout: "t/"}
    expected: perl/prove
  - name: java-with-an-unlabelled-profile
    # The profile identifies neither language nor framework. pom.xml does.
    repo: eval-corpus/java/cmdi/vulnerable
    payload:
      repo_profile: {summary: "internal utility; language not determined by recon",
                     primary_language: unknown, test_framework: unknown, test_layout: "unknown"}
    expected: maven/mvn
  - name: perl-with-an-empty-cpanfile
    # The cpanfile exists but declares no dependencies, so there is nothing to install from a
    # manifest and an agent keying off "install_commands non-empty" has no cue. The toolchain
    # is still Perl, and `prove` itself has to be installed rather than assumed (build-cpanm).
    repo: eval-corpus/perl/cmdi/vulnerable
    payload:
      repo_profile: {summary: "shell wrapper module", primary_language: unknown,
                     test_framework: unknown, test_layout: "t/"}
    expected: perl/prove
