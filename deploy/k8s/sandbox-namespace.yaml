# Isolated namespace for probe execution (phase 5). Probes run here as short-lived Pods
# under the gVisor RuntimeClass with default-deny egress and no service-account token.
apiVersion: v1
kind: Namespace
metadata:
  name: harness-sandbox
  labels: {harness/purpose: probe-sandbox}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
# Default-deny all ingress and egress in the sandbox namespace: probes have no network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: harness-sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# No default service account token in the sandbox namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: harness-sandbox
automountServiceAccountToken: false
---
# Enforce the restricted Pod Security Standard on the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: harness-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
