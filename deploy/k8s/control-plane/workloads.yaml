# Operator template: replace service values and image before deployment.
# Worker starts at zero until the existing Docker/runsc executor is verified.
apiVersion: v1
kind: Namespace
metadata:
  name: harness-control
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness
  namespace: harness-control
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harness-services
  namespace: harness-control
data:
  HARNESS_TEMPORAL_ADDRESS: triage.account.tmprl.cloud:7233
  HARNESS_TEMPORAL_NAMESPACE: triage.account
  HARNESS_TEMPORAL_TLS: 'true'
  HARNESS_DATABASE_TLS: 'true'
  HARNESS_TASK_QUEUE: triage-hosted
  HARNESS_ARTIFACT_BACKEND: s3
  HARNESS_S3_BUCKET: replace-with-existing-bucket
  HARNESS_S3_REGION: us-east-1
  HARNESS_S3_CREATE_BUCKET: 'false'
  HARNESS_MODEL_MODE: stub
  HARNESS_ENVIRONMENT: kubernetes
  HARNESS_WORKSPACE_DIR: /workspace
  HARNESS_ALLOW_INSECURE_RUNTIME: 'false'
  HARNESS_SANDBOX_RUNTIME: runsc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-api
  namespace: harness-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harness-api
  template:
    metadata:
      labels:
        app: harness-api
    spec:
      serviceAccountName: harness
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: harness:operator-built
        command:
        - harness
        - api
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        envFrom:
        - configMapRef:
            name: harness-services
        - secretRef:
            name: harness-service-credentials
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: scratch
          mountPath: /tmp
        - name: service-tls
          mountPath: /var/run/harness/tls
          readOnly: true
        - name: scratch
          mountPath: /workspace
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: scratch
        emptyDir: {}
      - name: service-tls
        secret:
          secretName: harness-service-tls
          optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-worker
  namespace: harness-control
spec:
  replicas: 0
  selector:
    matchLabels:
      app: harness-worker
  template:
    metadata:
      labels:
        app: harness-worker
    spec:
      serviceAccountName: harness
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: harness:operator-built
        command:
        - harness
        - worker
        envFrom:
        - configMapRef:
            name: harness-services
        - secretRef:
            name: harness-service-credentials
        env:
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /workspace
        - name: DOCKER_HOST
          valueFrom:
            configMapKeyRef:
              name: harness-executor
              key: DOCKER_HOST
        - name: DOCKER_TLS_VERIFY
          value: '1'
        - name: DOCKER_CERT_PATH
          value: /var/run/harness/docker-tls
        - name: DOCKER_CONFIG
          value: /workspace/.docker
        - name: HARNESS_BUILDX_BUILDER
          valueFrom:
            configMapKeyRef:
              name: harness-executor
              key: HARNESS_BUILDX_BUILDER
        - name: HARNESS_BUILD_EGRESS_PROXY
          valueFrom:
            configMapKeyRef:
              name: harness-executor
              key: HARNESS_BUILD_EGRESS_PROXY
        - name: HARNESS_BUILD_EGRESS_HOST_IP
          valueFrom:
            configMapKeyRef:
              name: harness-executor
              key: HARNESS_BUILD_EGRESS_HOST_IP
        - name: HARNESS_BUILD_EGRESS_NETWORK
          valueFrom:
            configMapKeyRef:
              name: harness-executor
              key: HARNESS_BUILD_EGRESS_NETWORK
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: scratch
          mountPath: /tmp
        - name: service-tls
          mountPath: /var/run/harness/tls
          readOnly: true
        - name: workspace
          mountPath: /workspace
        - name: docker-tls
          mountPath: /var/run/harness/docker-tls
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
      volumes:
      - name: scratch
        emptyDir: {}
      - name: service-tls
        secret:
          secretName: harness-service-tls
          optional: true
      - name: workspace
        persistentVolumeClaim:
          claimName: harness-worker-workspace
      - name: docker-tls
        secret:
          secretName: harness-docker-tls
---
apiVersion: v1
kind: Service
metadata:
  name: harness-api
  namespace: harness-control
spec:
  type: ClusterIP
  selector:
    app: harness-api
  ports:
  - name: http
    port: 8000
    targetPort: http
