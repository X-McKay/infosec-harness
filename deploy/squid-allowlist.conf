# Build-egress allowlist (D14). Squid forwards only to these registry hosts; everything
# else is denied. Add internal Artifactory/Nexus hosts as needed. The harness also sets
# NO_PROXY=localhost only, so all real egress must pass this allowlist.
acl allowed_registries dstdomain \
  pypi.org files.pythonhosted.org \
  registry.npmjs.org \
  repo.maven.apache.org repo1.maven.org \
  www.cpan.org cpan.metacpan.org cpan.org \
  deb.debian.org security.debian.org
http_access allow allowed_registries
http_access deny all
