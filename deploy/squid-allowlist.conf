# Build-egress allowlist (D14). Deny local, private, link-local, and metadata destinations
# before considering hostnames. The proxy is the internal build network's only dual-homed
# service, so an untrusted RUN step has no direct route around these ACLs.
acl denied_destinations dst \
  0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 \
  169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 \
  198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 \
  ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl allowed_registries dstdomain \
  registry-1.docker.io auth.docker.io \
  production.cloudflare.docker.com production.cloudfront.docker.com \
  pypi.org files.pythonhosted.org \
  registry.npmjs.org \
  repo.maven.apache.org repo1.maven.org \
  www.cpan.org cpan.metacpan.org cpan.org \
  deb.debian.org security.debian.org
http_access deny denied_destinations
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_registries
http_access deny all
