# Project-managed Linux executor for `./dev`.
#
# Lima verifies the digest-pinned Ubuntu image from its bundled _images template. The
# provisioning downloads below are independently pinned and SHA-256 checked before install.
# The daemon is inside this checkout's VM; no host Docker context, daemon configuration, or
# privileged service is changed. This original daemon only builds trusted workload images
# (plain runc, ordinary egress); scripts/openshell_guest.py runs the separate OpenShell daemon.
# Lima copies this template when the instance is created: editing it changes new VMs only.
minimumLimaVersion: 2.2.0

base:
  - template:_images/ubuntu-lts

containerd:
  system: false
  user: false

cpus: 6
memory: 8GiB
disk: 80GiB

provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      docker_version=29.1.3
      buildx_version=0.37.1
      marker=/var/lib/harness-dev-runtime/version
      expected="docker=${docker_version} buildx=${buildx_version} runtime=runc"
      if [[ -f "$marker" && "$(cat "$marker")" == "$expected" ]]; then
        systemctl enable --now containerd.service docker.service
        exit 0
      fi

      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl iptables uidmap
      rm -rf /var/lib/apt/lists/*

      case "$(uname -m)" in
        aarch64|arm64)
          docker_arch=aarch64
          docker_sha=2219f3ac48727d8c5546b13d5d271a58856188ecb8ff1f71f9e2f9aefde3ea76
          plugin_arch=arm64
          buildx_sha=e5cc9fe3bbff5cbc91230981f7860e06076110730a2db997082652199042a1f2
          ;;
        x86_64|amd64)
          docker_arch=x86_64
          docker_sha=c019c608ba2bb009dd673f3230e4d743f36a78d36166c6c2444c05d0aa9ff0d9
          plugin_arch=amd64
          buildx_sha=9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b
          ;;
        *) echo "unsupported guest architecture: $(uname -m)" >&2; exit 2 ;;
      esac

      stage="$(mktemp -d)"
      trap 'rm -rf "$stage"' EXIT
      fetch() {
        local url=$1 destination=$2 checksum=$3
        echo "downloading ${url}"
        curl --fail --location --show-error --progress-bar "$url" --output "$destination"
        printf '%s  %s\n' "$checksum" "$destination" | sha256sum --check --strict
      }

      docker_archive="$stage/docker.tgz"
      fetch "https://download.docker.com/linux/static/stable/${docker_arch}/docker-${docker_version}.tgz" \
        "$docker_archive" "$docker_sha"
      tar -xzf "$docker_archive" -C "$stage"
      install -m 0755 "$stage"/docker/* /usr/local/bin/

      install -d -m 0755 /usr/local/lib/docker/cli-plugins
      fetch "https://github.com/docker/buildx/releases/download/v${buildx_version}/buildx-v${buildx_version}.linux-${plugin_arch}" \
        /usr/local/lib/docker/cli-plugins/docker-buildx "$buildx_sha"
      chmod 0755 /usr/local/lib/docker/cli-plugins/docker-buildx

      install -d -m 0755 /etc/docker /var/lib/harness-dev-runtime
      cat >/etc/docker/daemon.json <<'JSON'
      {
        "default-runtime": "runc"
      }
      JSON
      cat >/etc/systemd/system/containerd.service <<'UNIT'
      [Unit]
      Description=Harness VM containerd
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/local/bin/containerd
      Delegate=yes
      KillMode=process
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
      UNIT
      cat >/etc/systemd/system/docker.service <<'UNIT'
      [Unit]
      Description=Harness VM Docker Engine
      After=network-online.target containerd.service
      Requires=containerd.service

      [Service]
      ExecStart=/usr/local/bin/dockerd --host=unix:///var/run/docker.sock --containerd=/run/containerd/containerd.sock
      ExecReload=/bin/kill -s HUP $MAINPID
      LimitNOFILE=infinity
      LimitNPROC=infinity
      LimitCORE=infinity
      Delegate=yes
      KillMode=process
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
      UNIT

      getent group docker >/dev/null || groupadd --system docker
      usermod -aG docker "{{.User}}"
      systemctl daemon-reload
      systemctl enable --now containerd.service docker.service
      timeout 90 bash -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
      test "$(docker info | awk '/Default Runtime:/ {print $3}')" = runc
      printf '%s\n' "$expected" >"$marker"

probes:
  - script: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      timeout 90 bash -c 'until sudo --non-interactive docker info >/dev/null 2>&1; do sleep 2; done'
      test "$(sudo --non-interactive docker info | awk '/Default Runtime:/ {print $3}')" = runc
      docker buildx version
    hint: Inspect /var/log/cloud-init-output.log in the managed VM.

portForwards:
  - guestSocket: /var/run/docker.sock
    hostSocket: "{{.Dir}}/sock/docker.sock"

message: |
  The InfoSec Harness managed runtime is ready. Use ./dev; do not change the host Docker context.
