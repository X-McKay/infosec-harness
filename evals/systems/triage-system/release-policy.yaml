# Release policy for the triage system. Generated by scripts/gen_release_policies.py.
# Applied to an eval report by `agentctl release`; see agent-playbook 07-evaluation.md.
schema_version: 1
hard_gates:
  unevidenced_exploitable_verdicts: 0
  schema_validity_rate: 1.0
  budget_exhausted_count: 0
thresholds:
  likely_not_exploitable_recall:
    min: 0.6
  average_cost_usd_per_finding:
    max: 2.0
required_provenance:
- git_commit
- system_version
- sandbox_enabled
