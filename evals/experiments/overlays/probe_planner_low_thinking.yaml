# One variable vs the committed spec: thinking low instead of medium.
#
# On the java corpus, probe-planner emitted 16,000 output tokens with finish=length and no tool
# call at all — it never produced its ProbePlan. On a reasoning model served over the
# chat-completions API the thinking is inline and spends the same budget as the answer, so a
# task the model finds hard can consume the whole cap before it commits to a structured output.
# Less inline reasoning should leave room for the answer.
#
#   harness eval run probe-planner --overlay evals/experiments/overlays/probe_planner_low_thinking.yaml --repeat 3
#
# RESULT: not adopted. Both arms scored 100% over 18 runs, and the overlay used *more* output
# (avg 9560 tokens vs 8471 baseline), so reducing the thinking budget neither helped accuracy nor
# reduced spend. Kept as a recorded negative result so the same idea is not retried blind.
#
# It also did not reproduce the failure that motivated it: the overrun happened on a java corpus
# case with full repository context, and probe-planner's dataset contains nothing that hard. The
# dataset's inability to reproduce a failure seen in a real run is the more useful finding.
probe-planner:
  model_settings:
    thinking: low
  metadata: {version: 1.0.1}
