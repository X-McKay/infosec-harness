version: "quality-gates-v1"
cases:
  - name: python-header-probe
    group: qg1-author-markers
    category: capability
    repo: evals/heldout/quality-gates-v1/fixtures/probe-python
    target_callable: make_header
    payload:
      finding: {title: "Response splitting", cwe: "CWE-113", severity: high, file_path: "header.py", start_line: 2}
      finding_context: {summary: "value reaches header text", reachability: reachable, reachability_rationale: "direct interpolation", target_callable: make_header}
      probe_plan: {hypothesis: "CRLF creates a second header", payload: "ok\r\nX-Probe: yes", oracle: marker_output, oracle_condition: "returned header contains X-Probe", precondition_checkpoint: "before make_header", test_file_path: "tests/test_header_probe.py"}
      oracle_nonce: "91ac74e2b5036fd8"
      environment_spec: {base_image: "python:3.12-slim", test_command: "python -m pytest -q -s {test_file}"}
    expected: conformant
  - name: javascript-redirect-probe
    group: qg1-author-markers
    category: capability
    repo: evals/heldout/quality-gates-v1/fixtures/probe-js
    target_callable: redirectTarget
    payload:
      finding: {title: "Open redirect", cwe: "CWE-601", severity: high, file_path: "redirect.js", start_line: 2}
      finding_context: {summary: "destination is returned", reachability: reachable, reachability_rationale: "direct return", target_callable: redirectTarget}
      probe_plan: {hypothesis: "absolute external URL survives", payload: "https://attacker.invalid/x", oracle: marker_output, oracle_condition: "returned origin is attacker.invalid", precondition_checkpoint: "before redirectTarget", test_file_path: "redirect.probe.test.js"}
      oracle_nonce: "6f08c1d7a42be935"
      environment_spec: {base_image: "node:22-slim", test_command: "npm test -- {test_file}"}
    expected: conformant
