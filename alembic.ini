# Alembic config for the run store (§9).
#
# There is deliberately no `sqlalchemy.url` here: env.py reads the URL from the app's own
# Settings (HARNESS_DATABASE_URL), so `alembic upgrade` and the running harness can never
# disagree about which database they mean. Override for a one-off target with
# `alembic -x url=... upgrade head`.

[alembic]
script_location = src/infosec_harness/persistence/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
