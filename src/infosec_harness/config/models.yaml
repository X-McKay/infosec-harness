# Model backends and tiers (spec §6.1, D9/D15/D16). No secrets in this file.
#
# Every agent.yaml names a tier (`model: sonnet`); the worker resolves it here. A tier that is
# not in `model_catalog` fails; it is never taken as a literal provider model id.
# Every agent runs on one backend: `default_backend`, overridden at runtime by
# HARNESS_MODEL_BACKEND. Unknown top-level keys are rejected.
backends:
  bedrock:
    kind: bedrock
    region: us-east-1
    # Local: `aws sso login --profile infosec-harness-sso` on the host; ~/.aws is mounted
    # read-only into the worker. In Kubernetes leave AWS_PROFILE unset (IRSA/Pod Identity).
    aws_profile: infosec-harness-sso
  gateway:
    kind: openai_compatible
    # No packaged endpoint: selecting this backend fails closed until the operator sets
    # HARNESS_MODEL_BASE_URL (or a base_url here, in their own HARNESS_MODELS_CONFIG).
    api_key_env: HARNESS_OPENAI_API_KEY   # optional; unset is fine for a keyless endpoint
    # The reference endpoint serves a reasoning model whose thinking is billed against
    # `max_tokens`. The agent specs are budgeted for Anthropic's separate thinking budget,
    # so raise the floor here rather than inflating every spec. Set to 0 for an endpoint
    # that reports reasoning separately.
    min_max_tokens: 16000
    # Explicit backend-scoped prices override catalog pricing (including gateway aliases).
    prices:
      claude-opus-5: {input_per_mtok: 5.0, output_per_mtok: 25.0}
      claude-sonnet-5: {input_per_mtok: 2.0, output_per_mtok: 10.0}
      claude-haiku-4-5: {input_per_mtok: 1.0, output_per_mtok: 5.0}
      # Self-hosted vLLM: no per-token billing. Zero keeps cost accounting honest
      # rather than silently reporting an unknown cost as None.
      Qwen3.6-35B-A3B-NVFP4: {input_per_mtok: 0.0, output_per_mtok: 0.0}

default_backend: bedrock

# Tier -> concrete model id per backend (D16). If the AWS account routes through
# cross-region inference profiles, prefix the Bedrock ids (e.g. `us.` / `global.`).
# The `gateway:` column must name ids the configured base_url actually serves
# (`curl $base_url/models`). The reference self-hosted endpoint serves exactly one model, so
# all three tiers map to it there: tier differences are not exercised against that endpoint.
model_catalog:
  opus:   {bedrock: anthropic.claude-opus-5,    gateway: Qwen3.6-35B-A3B-NVFP4}
  sonnet: {bedrock: anthropic.claude-sonnet-5,  gateway: Qwen3.6-35B-A3B-NVFP4}
  haiku:  {bedrock: anthropic.claude-haiku-4-5, gateway: Qwen3.6-35B-A3B-NVFP4}

# Versioned logical model policies (agent-playbook §3). Agent specs name a policy in
# `metadata.model_policy` rather than a provider model, so a routing change is a config
# change here instead of an edit to 11 specs. Each policy resolves to a tier above, which
# resolves to a concrete model per backend. Bump the version when a policy's intent
# changes so eval results stay attributable.
model_policies:
  fast-v1: haiku          # low-latency, low-cost
  balanced-v1: sonnet     # default production policy
  reasoning-v1: opus      # high-complexity, stricter budget
