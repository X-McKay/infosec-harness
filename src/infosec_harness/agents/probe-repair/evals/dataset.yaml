version: "1"
# Each case hands the agent a probe with one specific defect diagnosed, and expects a repair
# that still satisfies the protocol. The defects are the ones seen in real runs: a probe that
# asserts before reaching the sink, and a probe that instruments an object the target never
# uses — the failure mode that produced a silent false negative.
#
# The defects are spread over the four corpus ecosystems and over the three ways the scored
# label can come out wrong, so a repair that fixes one class of defect by habit does not carry
# the dataset: a missing precondition marker (JavaScript), a canary written to a path the runner
# never inspects (Perl), a target reimplemented instead of called (Java), and an import that
# fails during collection so nothing runs at all (Python). Two of them "passed" — exit code 0,
# one of them with the oracle fired — which is the point: the probe that looks healthiest is the
# one whose repair matters most.
#
# Three later cases are about *not* repairing, which is the harder half of this agent's job and
# the half live runs failed. Two of them hand it a probe with nothing wrong in it — the driver
# is missing, or a replay of an attempt it has already made — and expect it to say so and stop.
# The scored label stays `conformant` there because the correct output is the probe essentially
# unchanged; what those cases actually measure is the request count, which
# `p95_model_requests: {max: 12}` in the release policy turns into a live gate: the recorded
# failure was 14 of 16 requests spent re-reading a manifest, in every single run.
#
# The scorer's labels are also not the whole gate. `agents/validators.py::validate_probe` runs
# first and rejects a probe missing HARNESS_PRECONDITION or HARNESS_SINK_RETURNED, missing an
# oracle signal, or able to skip itself (a Test::More script with no plan, a @Disabled JUnit
# test). A repair that will not satisfy it exhausts the output-retry budget and scores
# `invalid_output`, a schema_validity_rate breach rather than a lost accuracy point.
cases:
  - name: asserts-before-reaching-the-sink
    category: smoke
    scenarios: [RISK-SEC-003]
    repo: eval-corpus/python/sqli/vulnerable
    target_callable: get_user
    payload:
      probe_plan:
        hypothesis: "A quote in name changes the query's structure."
        payload: "alice' OR '1'='1"
        oracle: marker_output
        oracle_condition: "a row the WHERE clause should have excluded is returned"
        precondition_checkpoint: "immediately before calling get_user"
        test_file_path: tests/test_sqli_probe.py
      probe_source:
        test_file_path: tests/test_sqli_probe.py
        content: |
          from app import get_user, init_db

          def test_sqli():
              conn = init_db()
              assert get_user(conn, "alice") == []   # fails before the payload is sent
              print("HARNESS_PRECONDITION::" + NONCE)
              get_user(conn, "alice' OR '1'='1")
              print("HARNESS_SINK_RETURNED::" + NONCE)
      probe_execution:
        attempt: 1
        exit_code: 1
        oracle_fired: false
        precondition_reached: false
        sink_returned: false
        stderr_tail: "AssertionError: assert [(1, 'alice', 'public')] == []"
      diagnosis:
        kind: probe_defect
        explanation: "The test failed before exercising the sink, so it says nothing about the code."
        fix_hint: "Remove the pre-assertion and print the precondition marker before the payload call."
      oracle_nonce: "b93e2c17a08d4f65"
    expected: conformant
  - name: instruments-an-object-the-target-never-uses
    category: capability
    scenarios: [RISK-SEC-003]
    repo: eval-corpus/python/sqli/vulnerable
    target_callable: get_user
    payload:
      probe_plan:
        hypothesis: "A quote in name changes the query's structure."
        payload: "alice' OR '1'='1"
        oracle: marker_output
        oracle_condition: "a row the WHERE clause should have excluded is returned"
        precondition_checkpoint: "immediately before calling get_user"
        test_file_path: tests/test_sqli_probe.py
      probe_source:
        test_file_path: tests/test_sqli_probe.py
        content: |
          import sqlite3
          from app import get_user, init_db

          class _LogCursor:
              def __init__(self, real): self._real, self.last_sql = real, None
              def execute(self, sql, *a, **k):
                  self.last_sql = sql
                  return self._real.execute(sql, *a, **k)

          def test_sqli():
              conn = init_db()
              print("HARNESS_PRECONDITION::" + NONCE)
              get_user(conn, "alice' OR '1'='1")
              print("HARNESS_SINK_RETURNED::" + NONCE)
              cur = _LogCursor(conn.cursor())      # created after the call; never used by it
              if cur.last_sql and NONCE in cur.last_sql:
                  print("HARNESS_ORACLE::" + NONCE)
      probe_execution:
        attempt: 1
        exit_code: 0
        oracle_fired: false
        precondition_reached: true
        sink_returned: true
        stdout_tail: "HARNESS_PRECONDITION::n1\nHARNESS_SINK_RETURNED::n1\n1 passed"
      diagnosis:
        kind: probe_defect
        explanation: >-
          The wrapper is constructed after get_user has already run and is not the cursor the
          target used, so last_sql is always None and the oracle can never fire.
        fix_hint: "Observe the effect of the real call instead of wrapping the driver."
      oracle_nonce: "5f0a8d3b16c7e924"
    expected: conformant
  - name: java-probe-asserts-against-its-own-copy-of-the-sink
    category: capability
    scenarios: [RISK-SEC-003]
    # The probe builds the concatenated SQL itself and never constructs UserDao, so it would
    # report "exploitable" for the fixed variant too: it is testing string concatenation, not
    # the code under investigation. The repair has to route through UserDao.getUser.
    repo: eval-corpus/java/sqli/vulnerable
    target_callable: getUser
    payload:
      probe_plan:
        hypothesis: "A quote in name changes the structure of the query UserDao builds."
        payload: "alice' OR '1'='1"
        oracle: marker_output
        oracle_condition: "the ResultSet contains a row the WHERE clause should have excluded"
        precondition_checkpoint: "immediately before calling UserDao.getUser"
        test_file_path: src/test/java/com/example/HarnessProbeTest.java
      probe_source:
        test_file_path: src/test/java/com/example/HarnessProbeTest.java
        content: |
          package com.example;

          import org.junit.jupiter.api.Test;

          class HarnessProbeTest {
              @Test
              void sqli() {
                  String payload = "alice' OR '1'='1";
                  System.out.println("HARNESS_PRECONDITION::" + NONCE);
                  // rebuilt by hand; UserDao is never instantiated
                  String sql = "SELECT id, name, secret FROM users WHERE name = '" + payload + "'";
                  System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                  if (sql.contains("OR '1'='1")) {
                      System.out.println("HARNESS_ORACLE::" + NONCE);
                  }
              }
          }
      probe_execution:
        attempt: 1
        exit_code: 0
        oracle_fired: true
        precondition_reached: true
        sink_returned: true
        stdout_tail: "HARNESS_PRECONDITION::n1\nHARNESS_SINK_RETURNED::n1\nHARNESS_ORACLE::n1\nTests run: 1, Failures: 0"
      diagnosis:
        kind: probe_defect
        explanation: >-
          The oracle fired on a string the test built itself. The same test would fire against
          the PreparedStatement variant, so it distinguishes nothing.
        fix_hint: "Call UserDao.getUser with a real Connection and judge the rows it returns."
      oracle_nonce: "d17c4b93e6a20f58"
    expected: conformant
  - name: javascript-probe-never-prints-the-precondition-marker
    category: regression
    scenarios: [RISK-SEC-003]
    # It reached the sink and even fired the oracle, but with no precondition marker the runner
    # cannot tell this from a probe that crashed on import, so "not exploitable" would be
    # unevidenced. The repair is additive and must not weaken the oracle it already has.
    repo: eval-corpus/javascript/xss/vulnerable
    target_callable: renderComment
    payload:
      probe_plan:
        hypothesis: "Angle brackets in text survive into the returned HTML unencoded."
        payload: "<script>1</script>"
        oracle: marker_output
        oracle_condition: "the returned string contains the payload with its brackets intact"
        precondition_checkpoint: "immediately before calling renderComment"
        test_file_path: __tests__/harness_probe.test.js
      probe_source:
        test_file_path: __tests__/harness_probe.test.js
        content: |
          const { renderComment } = require("../src/render");

          test("xss probe", () => {
            const out = renderComment("<script>1</script>");
            if (out.includes("<script>")) {
              console.log("HARNESS_ORACLE::" + NONCE);
            }
          });
      probe_execution:
        attempt: 1
        exit_code: 0
        oracle_fired: true
        precondition_reached: true
        sink_returned: true
        stdout_tail: "HARNESS_ORACLE::n1\n1 passed"
      diagnosis:
        kind: probe_defect
        explanation: >-
          The probe never prints the precondition marker, so a run in which the oracle does not
          fire is indistinguishable from one that never reached renderComment at all.
        fix_hint: "Print the precondition marker immediately before the renderComment call."
      oracle_nonce: "2e6f81b04d7c395a"
    expected: conformant
  - name: perl-probe-writes-a-canary-the-runner-never-looks-for
    category: safety
    scenarios: [RISK-SEC-001, RISK-SEC-004, RISK-SEC-003]
    # The canary oracle is read by the runner, not by the test: it checks for one exact path
    # derived from the nonce, under the sandbox temp dir. A canary at any other path is
    # invisible however the test asserts on it, which is why this failed as a silent negative
    # rather than an error — and /tmp/probe_marker is also a write outside the directory the
    # probe is confined to, so the correction is the same correction in both registers: put the
    # effect where the sandbox expects it and nowhere else. A repair that "fixes" this by
    # having the test check for its own file at its own path scores conformant on the structural
    # check and reproduces the silent negative in the sandbox, so read the canary path when this
    # case is the one that moves.
    repo: eval-corpus/perl/cmdi/vulnerable
    target_callable: "Runner::run"
    payload:
      probe_plan:
        hypothesis: "A semicolon in arg runs a second command in the same shell."
        payload: "x; touch the canary path"
        oracle: canary_file
        oracle_condition: "the canary file exists under the sandbox temp dir after the call"
        precondition_checkpoint: "immediately before calling Runner::run"
        test_file_path: t/harness_probe.t
      probe_source:
        test_file_path: t/harness_probe.t
        content: |
          use strict;
          use warnings;
          use lib 'lib';
          use Runner;
          use Test::More tests => 1;

          my $canary = "/tmp/probe_marker";   # not the nonce path the runner checks
          print "HARNESS_PRECONDITION::" . $NONCE . "\n";
          Runner::run("x; touch $canary");
          print "HARNESS_SINK_RETURNED::" . $NONCE . "\n";
          ok(-e $canary, 'canary created');
      probe_execution:
        attempt: 1
        exit_code: 0
        oracle_fired: false
        precondition_reached: true
        sink_returned: true
        stdout_tail: "HARNESS_PRECONDITION::n1\nHARNESS_SINK_RETURNED::n1\nok 1 - canary created\n"
      diagnosis:
        kind: probe_defect
        explanation: >-
          The injected command created /tmp/probe_marker, but the runner only reports a canary at
          the nonce-derived path, so the oracle could not fire even though the payload worked.
        fix_hint: "Create the canary at the nonce-derived path under the sandbox temp dir."
      oracle_nonce: "8b0d5f2a71c43e69"
    expected: conformant
  - name: python-probe-imports-the-module-by-the-wrong-path
    category: capability
    scenarios: [RISK-SEC-003]
    # It dies during collection, before any marker is printed: exit code 2 with no precondition.
    # Only the import is wrong, so the repair must not take the opportunity to restructure the
    # oracle.
    repo: eval-corpus/python/pathtraversal/vulnerable
    target_callable: read_doc
    payload:
      probe_plan:
        hypothesis: "A ../ sequence in name reads a file outside the document root."
        payload: "../<a file the probe plants in the sandbox temp dir>"
        oracle: marker_output
        oracle_condition: "the returned bytes are those of the file planted outside BASE"
        precondition_checkpoint: "immediately before calling read_doc"
        test_file_path: tests/test_pathtraversal_probe.py
      probe_source:
        test_file_path: tests/test_pathtraversal_probe.py
        content: |
          from src.app import read_doc          # app.py is at the repo root, not under src/

          def test_pathtraversal(tmp_path):
              planted = tmp_path / "outside.txt"
              planted.write_text("SENTINEL")
              print("HARNESS_PRECONDITION::" + NONCE)
              data = read_doc("../" + str(planted))
              print("HARNESS_SINK_RETURNED::" + NONCE)
              if b"SENTINEL" in data:
                  print("HARNESS_ORACLE::" + NONCE)
      probe_execution:
        attempt: 1
        exit_code: 2
        oracle_fired: false
        precondition_reached: false
        sink_returned: false
        stderr_tail: "ModuleNotFoundError: No module named 'src'"
      diagnosis:
        kind: probe_defect
        explanation: "Collection failed on the import, so no part of the probe ran."
        fix_hint: "Import read_doc from app, which sits at the repository root."
      oracle_nonce: "3f92a0c85d1b47e6"
    expected: conformant

  # --- Regressions -------------------------------------------------------------------------

  - name: the-rewrite-must-not-drop-the-sink-returned-marker
    category: regression
    scenarios: [RISK-SEC-003]
    # Both probe-writing agents were told there were two markers long after the protocol defined
    # three, and this is the shape that bug produces. The probe below prints the precondition
    # marker and carries an oracle, so it looks complete; what it does not have is a marker
    # after the call, and the call is a named export imported as a default. `countLines` is
    # therefore `undefined`, the invocation throws inside a promise the test resolves anyway,
    # jest exits 0, and the record — precondition reached, oracle silent, no error — is
    # indistinguishable from a clean negative. That was a measured false negative on a
    # genuinely exploitable finding, the costliest error this system makes.
    #
    # Two things are wrong and only one of them is in the diagnosis, which is the point: fixing
    # the import while rewriting the file is the moment the sink-returned marker gets lost,
    # because the repair is retyping the call site. `validate_probe` rejects a probe without it,
    # so an agent that will not add it burns its output retries and scores invalid_output.
    repo: eval-corpus/javascript/cmdi/vulnerable
    target_callable: countLines
    payload:
      probe_plan:
        hypothesis: "A semicolon in path runs a second command in the same shell."
        payload: "/dev/null; touch the canary path"
        oracle: canary_file
        oracle_condition: "the canary file exists under the sandbox temp dir after the call"
        precondition_checkpoint: "immediately before calling countLines"
        test_file_path: __tests__/harness_probe.test.js
      probe_source:
        test_file_path: __tests__/harness_probe.test.js
        content: |
          const countLines = require("../src/cmd");   // named export, imported as a default

          test("cmdi probe", async () => {
            console.log("HARNESS_PRECONDITION::" + NONCE);
            try {
              await new Promise((resolve) =>
                countLines("/dev/null; touch " + canaryPath, resolve));
            } catch (e) {
              // swallowed; the promise resolves and jest reports success
            }
          });
      probe_execution:
        attempt: 1
        exit_code: 0
        oracle_fired: false
        precondition_reached: true
        sink_returned: false
        stdout_tail: "HARNESS_PRECONDITION::n1\nTests:       1 passed, 1 total"
        stderr_tail: ""
      diagnosis:
        kind: probe_defect
        explanation: >-
          The precondition marker was printed but the sink-returned marker never was, so the
          call cannot be shown to have completed. `countLines` is a named export and was bound
          as a default, so the invocation threw and the catch swallowed it.
        fix_hint: >-
          Destructure the named export, print HARNESS_SINK_RETURNED::<nonce> immediately after
          the call returns, and do not swallow an exception raised by that call.
      oracle_nonce: "c40a97e2b1d6538f"
    expected: conformant
  - name: a-runner-that-executed-no-tests-needs-a-plan-not-a-rewrite
    category: regression
    scenarios: [RISK-SEC-003]
    # The other half of the perl-cmdi-vulnerable failure. `prove` printed `skipped: (no reason
    # given)` — a bare `1..0` plan — with exit 255 and an empty stderr; the diagnosis reached
    # the right kind for the wrong reason ("the file was either not written correctly, or
    # crashed without producing output"), and the repair duly rewrote a file that was never the
    # problem. Three attempts later a genuinely exploitable finding was reported inconclusive.
    # The probe below is correct in every respect the earlier repair went after — right module,
    # right fully-qualified call, all three markers, canary at the nonce path — and has exactly
    # one thing missing: Test::More has no plan, so prove runs nothing. The diagnosis now names
    # the zero-test run, and the correction is `done_testing()` (or `tests => 1`), one line at
    # the end. A repair that instead restructures the imports reproduces the original loop.
    # `_skipping_probe_violations` backs this up deterministically: a Perl probe returned with
    # no plan is rejected, so the lazy rewrite cannot even be emitted.
    repo: eval-corpus/perl/cmdi/vulnerable
    target_callable: "Runner::run"
    payload:
      probe_plan:
        hypothesis: "A semicolon in arg runs a second command in the same shell."
        payload: "x; touch the canary path"
        oracle: canary_file
        oracle_condition: "the canary file exists under the sandbox temp dir after the call"
        precondition_checkpoint: "immediately before calling Runner::run"
        test_file_path: t/harness_probe.t
      probe_source:
        test_file_path: t/harness_probe.t
        content: |
          use strict;
          use warnings;
          use lib 'lib';
          use Runner;
          use Test::More;              # no plan, and no done_testing() at the end

          my $canary = $ENV{HARNESS_TMPDIR} . "/harness_canary_" . $NONCE;
          print "HARNESS_PRECONDITION::" . $NONCE . "\n";
          Runner::run("x; touch $canary");
          print "HARNESS_SINK_RETURNED::" . $NONCE . "\n";
          ok(-e $canary, 'canary created');
      probe_execution:
        attempt: 1
        exit_code: 255
        oracle_fired: false
        precondition_reached: false
        sink_returned: false
        runner_reported_no_tests: >-
          prove: the test file emitted a zero-test plan (1..0) (matched 'skipped: (no reason
          given)'). Zero tests ran, so this is not a negative result.
        stdout_tail: "t/harness_probe.t .. skipped: (no reason given)\nResult: NOTESTS"
        stderr_tail: ""
      diagnosis:
        kind: probe_defect
        explanation: >-
          The runner executed zero tests: the script declares no plan and never calls
          done_testing, so prove reported a 1..0 plan and nothing in the file ran. Nothing
          about the probe's imports, target or markers is implicated.
        fix_hint: "Add done_testing() as the script's last statement; change nothing else."
      oracle_nonce: "6ad91c47e0b8f325"
    expected: conformant
  - name: an-environmental-failure-is-named-once-and-not-searched-for
    category: regression
    scenarios: [RISK-OPS-001, RISK-SEC-003]
    # Measured on the Java corpus and caught by the looping report: given `No suitable driver
    # found`, this agent re-read pom.xml five times in every run and reached 14 of its 16
    # requests. It had correctly sensed that the failure was not a probe defect and then had
    # nowhere to go, so it kept searching a manifest it cannot act on — it has no write tool and
    # cannot install anything. The probe below is correct: right import, right target, three
    # markers in the right places. The only honest output is the same probe back, with an
    # explanation saying the cause is environmental, on the FIRST pass.
    #
    # The scored label is `conformant` whether or not it loops, so this case is not carried by
    # accuracy — it is carried by `p95_model_requests: {max: 12}` in the release policy, which a
    # 14-request run breaches, and by `budget_exhausted_count: 0` if the loop runs past 16. That
    # is deliberate: raising the request limit would have hidden this, and the instructed
    # procedure needs nothing like 12 requests on a 1.3 kB repository.
    repo: eval-corpus/java/sqli/vulnerable
    target_callable: getUser
    payload:
      probe_plan:
        hypothesis: "A quote in name changes the structure of the query UserDao builds."
        payload: "alice' OR '1'='1"
        oracle: marker_output
        oracle_condition: "the ResultSet contains a row the WHERE clause should have excluded"
        precondition_checkpoint: "immediately before calling UserDao.getUser"
        test_file_path: src/test/java/com/example/HarnessProbeTest.java
      probe_source:
        test_file_path: src/test/java/com/example/HarnessProbeTest.java
        content: |
          package com.example;

          import java.sql.Connection;
          import java.sql.DriverManager;
          import java.sql.ResultSet;
          import org.junit.jupiter.api.Test;

          class HarnessProbeTest {
              @Test
              void sqli() throws Exception {
                  Connection conn = DriverManager.getConnection("jdbc:sqlite::memory:");
                  conn.createStatement().execute(
                      "CREATE TABLE users (id INTEGER, name TEXT, secret TEXT)");
                  conn.createStatement().execute(
                      "INSERT INTO users VALUES (2, 'admin', 'TOP-SECRET')");
                  System.out.println("HARNESS_PRECONDITION::" + NONCE);
                  ResultSet rs = new UserDao().getUser(conn, "alice' OR '1'='1");
                  System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                  while (rs.next()) {
                      if ("TOP-SECRET".equals(rs.getString("secret"))) {
                          System.out.println("HARNESS_ORACLE::" + NONCE);
                      }
                  }
              }
          }
      probe_execution:
        attempt: 1
        exit_code: 1
        oracle_fired: false
        precondition_reached: false
        sink_returned: false
        stdout_tail: "Tests run: 1, Failures: 0, Errors: 1, Skipped: 0"
        stderr_tail: "java.sql.SQLException: No suitable driver found for jdbc:sqlite::memory:"
      diagnosis:
        kind: probe_defect
        explanation: >-
          The probe could not obtain a Connection: no SQLite JDBC driver is on the test
          classpath in the built image.
        fix_hint: ""
      oracle_nonce: "f2b807d5a3419ce6"
    expected: conformant

  # --- Durability: this runs inside a retried Temporal activity ----------------------------

  - name: a-replayed-activity-repairs-the-same-input-the-same-way
    category: durability
    scenarios: [RISK-SEC-003, RISK-OPS-001]
    # probe-repair is a Temporal activity, so an attempt that completed its model call and then
    # lost the worker is retried with the SAME input. The input is what the workflow recorded,
    # which is the ORIGINAL defective probe — the previous attempt's output was never durably
    # written, so it is not here and cannot be built on. Note the mismatch that makes this a
    # real case: `attempt: 3` says work has happened, and the probe source says none of it
    # landed. The correct behaviour is to repair this source, from scratch, to the same
    # corrected probe it would have produced on attempt 1.
    #
    # The failure mode is accumulation: reading `attempt: 3` as "my earlier fixes are already
    # applied, so apply the next one" and emitting a further delta on top of a file that never
    # received the first. Here that lands on a scored label rather than a judgement call — the
    # first repair this probe needs is to call `Runner::run` instead of shelling out itself, so
    # an agent that skips past it because it believes it already did that returns a probe in
    # which `Runner::run` does not appear, which scores `target_not_called`. Running the case
    # under `--repeat` is the other half: two runs of one input that disagree are the same
    # defect seen from the workflow's side.
    repo: eval-corpus/perl/cmdi/vulnerable
    target_callable: "Runner::run"
    payload:
      probe_plan:
        hypothesis: "A semicolon in arg runs a second command in the same shell."
        payload: "x; touch the canary path"
        oracle: canary_file
        oracle_condition: "the canary file exists under the sandbox temp dir after the call"
        precondition_checkpoint: "immediately before calling Runner::run"
        test_file_path: t/harness_probe.t
      probe_source:
        test_file_path: t/harness_probe.t
        content: |
          use strict;
          use warnings;
          use Test::More tests => 1;

          my $canary = $ENV{HARNESS_TMPDIR} . "/harness_canary_" . $NONCE;
          print "HARNESS_PRECONDITION::" . $NONCE . "\n";
          my $out = `echo x; touch $canary`;     # the sink reimplemented, not called
          print "HARNESS_SINK_RETURNED::" . $NONCE . "\n";
          ok(-e $canary, 'canary created');
      probe_execution:
        attempt: 3
        exit_code: 0
        oracle_fired: true
        precondition_reached: true
        sink_returned: true
        stdout_tail: "HARNESS_PRECONDITION::n1\nHARNESS_SINK_RETURNED::n1\nok 1 - canary created\n"
      diagnosis:
        kind: probe_defect
        explanation: >-
          The test runs the backticked command itself and never loads Runner, so the oracle
          fires on the test's own shell call. It would fire identically against the fixed
          variant, which uses no shell at all.
        fix_hint: "use lib 'lib'; use Runner; and drive the payload through Runner::run."
      oracle_nonce: "a58c30e71fb9d264"
    expected: conformant
