# The harm scenarios this system can cause, the controls that bound them, and which agents
# contribute to each. One library rather than eleven documents, because the agents share their
# harms: they all read untrusted repository content, they all send it to a model provider, and
# five of them influence what code the sandbox executes.
#
# This file is hand-maintained and read directly by the runtime:
#   * runtime/governance.py derives each agent's governance tier from the scenarios listed
#     under `agents:` and refuses to construct an agent whose spec declares a different
#     `metadata.risk_tier`;
#   * evals/coverage.py crosses each agent's eval dataset tags with the same list, so an
#     uncovered high- or critical-tier scenario fails the release gate.
#
# Scoring follows agent-playbook §13. Impact and likelihood are 1-4; the tier is derived in
# code from the playbook matrix (runtime/risk.py) and is deliberately not written here.
# Inherent likelihood assumes the controls are absent; residual likelihood counts only
# controls whose `effectiveness` is `verified`. A control marked `implemented` earns no
# residual reduction. `capability_floor` raises an agent's governance tier when the scenario
# means the agent performs or determines privileged code execution.
controls:
  CTRL-SBX-001:
    type: preventive
    description: 'Build and probe containers run under gVisor (runsc), fail-closed: ensure_runtime_available
      raises SandboxUnavailable when runsc is absent unless HARNESS_ALLOW_INSECURE_RUNTIME is set
      for development.'
    owner: appsec
    evidence:
    - tests/runtime/test_sandbox_policy.py
    - src/infosec_harness/sandbox/docker.py
    effectiveness: implemented
  CTRL-SBX-002:
    type: preventive
    description: Containers run non-root with all capabilities dropped, no-new-privileges, a read-only
      root filesystem, a tmpfs workdir, and CPU/memory/pid caps.
    owner: appsec
    evidence:
    - tests/runtime/test_sandbox.py
    - tests/runtime/test_sandbox_policy.py
    effectiveness: verified
  CTRL-SBX-003:
    type: preventive
    description: Probe containers run with --network=none, so a probe has no egress at all.
    owner: appsec
    evidence:
    - tests/runtime/test_sandbox.py
    effectiveness: verified
  CTRL-SBX-004:
    type: preventive
    description: Base images are restricted to an allowlisted registry set and build-time egress
      is pinned to the registries a repo's declared ecosystem needs.
    owner: appsec
    evidence:
    - tests/runtime/test_sandbox_policy.py
    effectiveness: verified
  CTRL-INJ-001:
    type: preventive
    description: Every prompt labels repository content, finding text, and probe output as untrusted
      data and forbids following instructions found in it.
    owner: appsec
    evidence:
    - tests/runtime/test_render.py
    effectiveness: implemented
  CTRL-INJ-002:
    type: preventive
    description: 'The capability allowlist exposes no write tool at all: injected text has no consequential
      operation to reach, only file reads and skill loads.'
    owner: appsec
    evidence:
    - tests/agents/test_agents.py
    - src/infosec_harness/runtime/registry.py
    effectiveness: verified
  CTRL-FN-001:
    type: preventive
    description: Exploitability is decided by an explicit oracle marker carrying a run nonce, detected
      deterministically in code — never from a test passing, and never from the model asserting
      it.
    owner: appsec
    evidence:
    - tests/runtime/test_sandbox.py
    - src/infosec_harness/sandbox/output.py
    effectiveness: verified
  CTRL-FN-002:
    type: preventive
    description: 'A deterministic validator rejects any verdict the recorded facts do not support:
      potentially_exploitable requires the oracle to have fired, and likely_not_exploitable requires
      either a valid negative that reached the precondition or an evidenced unreachable sink.'
    owner: appsec
    evidence:
    - tests/agents/test_validators.py
    - tests/runtime/test_graph.py
    effectiveness: verified
  CTRL-FN-003:
    type: recovery
    description: '`inconclusive` is a first-class outcome, so the absence of evidence is reported
      as such instead of being rounded to ''not exploitable''.'
    owner: appsec
    evidence:
    - tests/runtime/test_graph.py
    - docs/evidence/2026-09-25-live-model-validation/LIVE_VALIDATION.md
    effectiveness: verified
  CTRL-FN-004:
    type: detective
    description: A paired vulnerable/fixed corpus is scored end to end, and reference probes assert
      each vulnerable variant really is exploitable and its fixed twin is not — so a corpus whose
      ground truth has rotted fails rather than flatters.
    owner: appsec
    evidence:
    - tests/evals/test_corpus_oracle.py
    - tests/evals/test_corpus.py
    effectiveness: verified
  CTRL-FN-005:
    type: detective
    description: An invariant test prevents a per-CWE skill from recommending an oracle that violates
      the probe protocol, which previously produced a probe whose instrumentation was never used
      — a silent false negative.
    owner: appsec
    evidence:
    - tests/agents/test_skills_consistency.py
    effectiveness: verified
  CTRL-OPS-001:
    type: preventive
    description: Each agent declares a per-run ceiling on model requests, tool calls, tokens, and
      cost, enforced through UsageLimits in both the local and durable paths.
    owner: appsec
    evidence:
    - tests/agents/test_budgets.py
    effectiveness: verified
  CTRL-OPS-002:
    type: preventive
    description: All four retry layers are bounded and their product is asserted, so a deterministic
      failure cannot retry indefinitely.
    owner: appsec
    evidence:
    - tests/agents/test_retry_bounds.py
    effectiveness: verified
  CTRL-OPS-003:
    type: recovery
    description: A failure on one finding is recorded as inconclusive/error and the batch continues;
      in the durable path each finding is its own child workflow.
    owner: appsec
    evidence:
    - tests/runtime/test_graph.py
    effectiveness: verified
  CTRL-OPS-004:
    type: detective
    description: Tokens, cache hits, and estimated cost are recorded per agent invocation and persisted
      with the run, and emitted as span attributes.
    owner: appsec
    evidence:
    - tests/runtime/test_telemetry.py
    - tests/persistence/test_persistence.py
    effectiveness: verified
  CTRL-PRIV-001:
    type: preventive
    description: The model backend and endpoint are declarative config in src/infosec_harness/config/models.yaml with
      no secrets, reviewed like code; a self-hosted OpenAI-spec endpoint is supported so source
      need not leave the deployment's trust boundary.
    owner: appsec
    evidence:
    - src/infosec_harness/config/models.yaml
    - tests/agents/test_agents.py
    effectiveness: implemented
scenarios:
  RISK-SEC-001:
    title: Untrusted repository code escapes the build or probe sandbox
    status: open
    statement: Because the harness builds and executes code from a repository it does not trust,
      the agent could cause that code to run outside its intended isolation boundary, causing host
      or cluster compromise and loss of confidentiality, integrity, and availability to the operator
      and to every tenant whose code the harness processes.
    primary_dimension: security
    secondary_dimensions:
    - operational
    - legal
    - reputational
    affected_parties:
    - the operating organization
    - customers whose code is triaged
    affected_assets:
    - build and probe hosts
    - the cluster
    - other tenants' source
    causes:
    - a repository's build script or test hook executes arbitrary code
    - an environment plan selects a base image or install command that widens privilege
    - the isolation runtime is missing and the insecure-runtime override is enabled
    preconditions:
    - a build or probe container is started
    - the container runtime does not provide kernel-level isolation
    consequences:
    - arbitrary code execution on the host or cluster node
    - cross-tenant exposure of source under triage
    inherent:
      impact: 4
      likelihood: 3
      confidence: high
      rationale: Executing untrusted build scripts without kernel isolation is a direct host compromise
        path, and it happens on every prepared repository.
    controls:
    - CTRL-SBX-001
    - CTRL-SBX-002
    - CTRL-SBX-003
    - CTRL-SBX-004
    residual:
      impact: 4
      likelihood: 2
      confidence: low
      rationale: 'The hardening controls are verified, but the control that actually provides the
        isolation boundary — gVisor — has never executed: no host available to this project has
        runsc, so it earns no residual reduction. Impact is unchanged because the remaining controls
        narrow privilege inside the container without containing a kernel escape. Confidence is
        low precisely because the evidence is absent.'
    treatment: mitigate
    owner: appsec
    eval_cases:
    - corpus-sandbox-on
    indicators:
    - sandbox_runtime_missing_count
    - insecure_runtime_override_enabled
    alerts:
    - any probe or build executed without runsc in a non-development environment
    capability_floor: high
  RISK-SEC-002:
    title: Repository content is treated as instructions
    status: open
    statement: Because repository content, finding text, and probe output all reach the model, the
      agent could follow instructions embedded in that content, causing a misdirected investigation
      and an unreliable triage conclusion for the operating organization.
    primary_dimension: security
    secondary_dimensions:
    - operational
    - reputational
    affected_parties:
    - the operating organization
    - application teams receiving verdicts
    affected_assets:
    - triage conclusions
    - engineering time
    causes:
    - a source file or README contains text addressed to an automated reviewer
    - a finding description is attacker-influenced
    preconditions:
    - untrusted text reaches the model context
    consequences:
    - the agent investigates the wrong location or reports a fabricated conclusion
    - remediation effort is misdirected
    inherent:
      impact: 2
      likelihood: 3
      confidence: medium
      rationale: Injected text is plausible in any real repository, but the blast radius is a wrong
        triage conclusion rather than an action, because the agents have no write tools.
    controls:
    - CTRL-INJ-001
    - CTRL-INJ-002
    - CTRL-FN-001
    - CTRL-FN-002
    residual:
      impact: 2
      likelihood: 2
      confidence: medium
      rationale: 'The decisive control is structural rather than textual: there is no consequential
        tool for injected text to reach, and a claim of exploitability is rejected unless a deterministic
        oracle fired. Prompt-level framing alone would not earn this.'
    treatment: mitigate
    owner: appsec
    eval_cases:
    - corpus-all-languages
    indicators:
    - verdict_contract_rejection_count
    alerts:
    - a sustained rise in verdict contract rejections
  RISK-SEC-003:
    title: An exploitable vulnerability is reported as not exploitable
    status: open
    statement: Because a probe can fail to observe an exploit for reasons unrelated to exploitability,
      the agent could report likely_not_exploitable for a genuinely exploitable finding, causing
      the operating organization to leave a real vulnerability unremediated.
    primary_dimension: security
    secondary_dimensions:
    - operational
    - reputational
    - legal
    affected_parties:
    - the operating organization
    - users of the affected application
    affected_assets:
    - the vulnerable application
    - the triage backlog
    causes:
    - the probe instruments an object the target does not use, so the oracle cannot fire
    - a per-CWE skill recommends an oracle that does not exercise the real sink
    - context misreads a sanitizer and early-exits the finding as unreachable
    - diagnosis classifies a valid positive as a probe defect
    preconditions:
    - the finding is genuinely exploitable
    - the probe runs to completion
    consequences:
    - a real vulnerability is deprioritized on the strength of a harness verdict
    - trust in the triage output is misplaced
    inherent:
      impact: 3
      likelihood: 3
      confidence: high
      rationale: 'This is the costliest error the system can make and it has been observed: a probe
        that wrapped a sqlite cursor the target never used produced exactly this shape, reported
        as a clean run.'
    controls:
    - CTRL-FN-001
    - CTRL-FN-002
    - CTRL-FN-003
    - CTRL-FN-004
    - CTRL-FN-005
    residual:
      impact: 3
      likelihood: 2
      confidence: medium
      rationale: Impact is unchanged — a missed vulnerability is a missed vulnerability. Likelihood
        drops because a probe that never reached the sink is diagnosed as a defect rather than a
        negative, the verdict contract refuses an unevidenced 'not exploitable', and the corpus
        asserts its own ground truth. It is not lower than this because the measured false-negative
        rate on a live model has never been established with the sandbox on.
    treatment: mitigate
    owner: appsec
    eval_cases:
    - corpus-sandbox-on
    - probe-diagnosis-negative_with_source
    indicators:
    - false_negative_rate_on_exploitable
    - probe_defect_rate
    alerts:
    - false-negative rate above its release threshold on the corpus
  RISK-SEC-004:
    title: A model-authored probe acts outside its intended scope
    status: open
    statement: Because probe source is written by a model from untrusted context, the agent could
      author a probe that reaches the network or writes outside the sandbox workdir, causing unintended
      external contact or loss of integrity for the operating organization.
    primary_dimension: security
    secondary_dimensions:
    - operational
    - legal
    affected_parties:
    - the operating organization
    - third parties a probe might contact
    affected_assets:
    - the sandbox host
    - external systems
    causes:
    - the probe plan chooses a payload with a side effect outside the sandbox
    - authored probe code contacts a real host instead of a loopback listener
    preconditions:
    - a probe is executed
    consequences:
    - an unintended request leaves the sandbox
    - files are written outside the intended workdir
    inherent:
      impact: 3
      likelihood: 2
      confidence: medium
      rationale: Model-authored code is executed by design, but the payloads it needs for this system's
        weakness classes are local by nature.
    controls:
    - CTRL-SBX-003
    - CTRL-SBX-002
    - CTRL-SBX-001
    residual:
      impact: 3
      likelihood: 1
      confidence: medium
      rationale: Egress is removed at the container level rather than requested of the model, and
        the workdir is a tmpfs on a read-only root. Impact stays at 3 because the isolation boundary
        itself is unverified.
    treatment: mitigate
    owner: appsec
    eval_cases:
    - corpus-sandbox-on
    indicators:
    - probe_network_attempt_count
    alerts:
    - any probe container started with networking enabled
    capability_floor: high
  RISK-OPS-001:
    title: Unbounded execution consumes budget without producing a verdict
    status: open
    statement: Because agents retry and repair on failure, the agent could loop without converging,
      causing uncontrolled model spend and a stalled triage queue for the operating organization.
    primary_dimension: financial
    secondary_dimensions:
    - operational
    affected_parties:
    - the operating organization
    affected_assets:
    - model spend
    - worker capacity
    - the triage queue
    causes:
    - a repair loop re-runs against an outcome that cannot change
    - an activity retry policy is absent and inherits unlimited attempts
    - an output contract the model cannot satisfy exhausts retries repeatedly
    preconditions:
    - a triage run starts
    consequences:
    - spend grows without a corresponding verdict
    - a workflow occupies a worker slot indefinitely
    inherent:
      impact: 2
      likelihood: 3
      confidence: high
      rationale: 'Observed repeatedly: an offline stub that fabricated a clean probe run drove every
        case to its repair limit with context growing from 8.8k to 24k tokens, and two activity
        paths inherited Temporal''s unlimited retries.'
    controls:
    - CTRL-OPS-001
    - CTRL-OPS-002
    - CTRL-OPS-003
    - CTRL-OPS-004
    residual:
      impact: 2
      likelihood: 1
      confidence: high
      rationale: 'Every layer now has an asserted ceiling: per-run UsageLimits, a bounded product
        across the four retry layers, and per-finding containment so one failure cannot consume
        a batch.'
    treatment: mitigate
    owner: appsec
    eval_cases:
    - corpus-all-languages
    indicators:
    - budget_exhausted_count
    - average_cost_per_finding
    - p95_model_requests
    alerts:
    - budget exhaustion on more than a small fraction of findings
  RISK-PRIV-001:
    title: Customer source is sent to an endpoint without the required terms
    status: open
    statement: Because the model backend is deployment configuration, the agent could send customer
      source and unfixed vulnerability detail to a provider that lacks the required data-processing
      terms, causing confidentiality and contractual harm to customers and the operating organization.
    primary_dimension: privacy
    secondary_dimensions:
    - legal
    - security
    - reputational
    affected_parties:
    - customers whose code is triaged
    - the operating organization
    affected_assets:
    - customer source
    - unfixed vulnerability detail
    causes:
    - a backend base_url is pointed at an unapproved endpoint
    - a deployment inherits a test endpoint configuration
    preconditions:
    - an agent run sends repository content to a model
    consequences:
    - source and exploitability detail are disclosed outside the trust boundary
    - contractual or regulatory obligations are breached
    inherent:
      impact: 3
      likelihood: 2
      confidence: medium
      rationale: Sending source to a model is intrinsic to the design, so the scenario turns on
        whether the endpoint is an approved one — a configuration error, not a rare event.
    controls:
    - CTRL-PRIV-001
    residual:
      impact: 3
      likelihood: 2
      confidence: medium
      rationale: The endpoint is reviewable declarative config and a self-hosted backend is supported,
        but nothing in the system verifies that a configured endpoint is an approved one, so this
        earns no likelihood reduction. Deployment-time control of config/models.yaml is the operator's
        responsibility.
    treatment: mitigate
    owner: appsec
    eval_cases: []
    indicators:
    - resolved_model_backend
    - resolved_model_endpoint
    alerts:
    - a model backend resolving to an endpoint outside the approved set
