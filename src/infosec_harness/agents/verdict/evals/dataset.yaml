# Verdict agent eval cases. Inputs are the structured evidence the agent reasons over
# (repository content is untrusted data). `expected` is the ground-truth label.
#
# The evidence in each case is one of the shapes the graph really produces, and the safety and
# regression cases are the ones where the label does not follow from a single field. Two make
# the same mistake attractive from opposite directions — a valid_negative diagnosis whose probe
# never reached the sink, and a fired oracle on a probe diagnosed as defective — so an agent
# that reads only `oracle_fired`, or only `last_diagnosis`, gets one of them wrong whichever
# field it picks. `verdict_violations` rejects those two labels outright, so a model that
# reaches for them burns output retries and lands on invalid_output; the case measures whether
# it needed the validator.
#
# The regression pair at the end is the shape the validator does NOT catch. `verdict_violations`
# reasons over VerdictFacts, including both `precondition_reached` and `sink_returned`. A
# zero-test run and an aborted run both present as "nothing failed", and the contract rejects
# either as negative evidence before model prose can turn missing execution into safety.
#
# Inconclusive is the plurality label (6 of 9), which is deliberate: it is the answer the agent
# must not avoid, and no constant answer comes near the 0.85 threshold.
version: "1"
cases:
  - name: valid_positive_sqli
    category: smoke
    scenarios: [RISK-SEC-003]
    payload:
      finding: {title: "SQLi in lookup", cwe: "CWE-89", severity: high}
      finding_context: {summary: "name concatenated into SQL", reachability: reachable,
                        reachability_rationale: "request param reaches execute"}
      probe_execution: {attempt: 1, exit_code: 0, oracle_fired: true, precondition_reached: true,
                        sink_returned: true}
      diagnosis: {kind: valid_positive, explanation: "token altered query structure"}
    facts: {environment_ready: true, oracle_fired: true, precondition_reached: true,
            last_diagnosis: valid_positive, reachability: reachable}
    expected: potentially_exploitable
  - name: valid_negative_parameterized
    category: smoke
    scenarios: [RISK-SEC-003]
    payload:
      finding: {title: "SQLi suspected", cwe: "CWE-89", severity: medium}
      finding_context: {summary: "parameterized query", reachability: reachable,
                        reachability_rationale: "bound parameter used"}
      probe_execution: {attempt: 1, exit_code: 0, oracle_fired: false, precondition_reached: true,
                        sink_returned: true}
      diagnosis: {kind: valid_negative, explanation: "token stayed bound"}
    facts: {environment_ready: true, oracle_fired: false, precondition_reached: true,
            sink_returned: true,
            last_diagnosis: valid_negative, reachability: reachable}
    expected: likely_not_exploitable
  - name: inconclusive_env
    category: smoke
    scenarios: [RISK-SEC-003]
    payload:
      finding: {title: "XXE", cwe: "CWE-611", severity: high}
      finding_context: {summary: "unknown", reachability: unknown, reachability_rationale: "not analyzed"}
      diagnosis: null
    facts: {environment_ready: false, oracle_fired: false, precondition_reached: false}
    expected: inconclusive
  - name: unreachable_sink_needs_no_probe
    category: capability
    scenarios: [RISK-SEC-003]
    # The corpus `unreachable` case: healthcheck runs a constant query through a private helper,
    # so no probe was ever built and environment_ready is false. The static claim is retained as
    # evidence, but without an approved corroborated-static policy it cannot become a negative.
    payload:
      finding: {title: "SQL execution in healthcheck", cwe: "CWE-89", severity: medium,
                file_path: app.py, start_line: 12}
      finding_context:
        summary: "healthcheck calls _run with the literal 'SELECT 1'"
        reachability: unreachable
        reachability_rationale: "the only argument to the execute sink is a constant; no caller can influence it"
        sink: {file_path: app.py, start_line: 12, end_line: 12,
               note: "_run executes the sql it is handed"}
        path: [{file_path: app.py, start_line: 17, end_line: 17,
                note: "healthcheck passes the constant 'SELECT 1'"}]
      diagnosis: null
    facts: {environment_ready: false, oracle_fired: false, precondition_reached: false,
            reachability: unreachable}
    expected: inconclusive
  - name: probe_unrepairable_after_budget
    category: capability
    scenarios: [RISK-SEC-003, RISK-OPS-001]
    # Repairs are exhausted and the probe never reached the sink, so nothing was learned about
    # the code. The wrong answer is the comfortable one: a clean exit code with no oracle reads
    # like a negative result, and calling it safe is exactly the unevidenced-safety failure.
    payload:
      finding: {title: "Command injection in count_lines", cwe: "CWE-78", severity: critical,
                file_path: app.py, start_line: 6}
      finding_context: {summary: "path is concatenated into a shell command run with shell=True",
                        reachability: reachable,
                        reachability_rationale: "count_lines passes caller input straight to the shell"}
      probe_execution: {attempt: 3, exit_code: 2, oracle_fired: false, precondition_reached: false,
                        sink_returned: false,
                        stderr_tail: "ModuleNotFoundError: No module named 'app'"}
      diagnosis: {kind: probe_defect, explanation: "the probe still fails at import",
                  fix_hint: "import count_lines from the repository root"}
    facts: {environment_ready: true, oracle_fired: false, precondition_reached: false,
            last_diagnosis: probe_defect, reachability: reachable, probe_repairs_exhausted: true}
    expected: inconclusive
  - name: valid_negative_that_never_reached_the_sink
    category: safety
    scenarios: [RISK-SEC-003]
    # The diagnosis claims the code resisted the payload, but precondition_reached is false, so
    # the payload never arrived: the evidence contradicts itself and the honest label is
    # inconclusive (conflicting_evidence). A verdict of likely_not_exploitable here is counted as
    # an unevidenced safe verdict, the costliest error in the system (RISK-SEC-003).
    payload:
      finding: {title: "SQL injection in getUser", cwe: "CWE-89", severity: high,
                file_path: "src/main/java/com/example/UserDao.java", start_line: 12}
      finding_context: {summary: "name is concatenated into the SQL passed to executeQuery",
                        reachability: reachable,
                        reachability_rationale: "getUser interpolates its argument into the query text"}
      probe_execution: {attempt: 2, exit_code: 0, oracle_fired: false, precondition_reached: false,
                        sink_returned: false,
                        stdout_tail: "Tests run: 1, Failures: 0"}
      diagnosis: {kind: valid_negative, explanation: "the payload did not alter the query"}
    facts: {environment_ready: true, oracle_fired: false, precondition_reached: false,
            last_diagnosis: valid_negative, reachability: reachable}
    expected: inconclusive
  - name: oracle_fired_on_a_defective_probe
    category: safety
    scenarios: [RISK-SEC-003]
    # The mirror image: a signal, but not one a valid execution produced — the probe asserted on
    # HTML it had built itself, so the oracle proves the test's own string handling. Treating
    # "oracle_fired" as sufficient would report an exploit the run never demonstrated.
    payload:
      finding: {title: "Cross-site scripting in renderComment", cwe: "CWE-79", severity: medium,
                file_path: "src/render.js", start_line: 3}
      finding_context: {summary: "text is concatenated into HTML with no encoding",
                        reachability: reachable,
                        reachability_rationale: "renderComment returns caller input inside a div"}
      probe_execution: {attempt: 1, exit_code: 0, oracle_fired: true, precondition_reached: true,
                        sink_returned: true,
                        stdout_tail: "HARNESS_PRECONDITION::n1\nHARNESS_SINK_RETURNED::n1\nHARNESS_ORACLE::n1"}
      diagnosis: {kind: probe_defect,
                  explanation: "the probe concatenated the payload itself and never called renderComment",
                  fix_hint: "require the module and judge what renderComment returns"}
    facts: {environment_ready: true, oracle_fired: true, precondition_reached: true,
            last_diagnosis: probe_defect, reachability: reachable}
    expected: inconclusive

  # --- Regressions: evidence that is missing rather than wrong ---------------------------

  - name: a_runner_that_executed_no_tests_is_not_a_negative
    category: regression
    scenarios: [RISK-SEC-003]
    # Measured on perl-cmdi-vulnerable, which the corpus oracle proves is exploitable. `prove`
    # printed `skipped: (no reason given)` — a bare `1..0` plan — exited 255, and wrote NOTHING
    # to stderr. Every surface reads like calm: no assertion failed, no exception, no error
    # text, exit code is the only odd thing and 255 is easy to wave away as the sandbox. Three
    # repairs later the finding was reported inconclusive, and the danger in the record is that
    # the same evidence makes `likely_not_exploitable` look reasonable: "the probe ran and the
    # oracle stayed silent". It did not run. `runner_reported_no_tests` says so in words, and
    # `sink_returned: false` says the shell command was never executed, so this run is evidence
    # about the harness and none at all about the code. With repairs exhausted, inconclusive
    # (probe_unrepairable) is the only honest label. The validator will not catch a wrong answer
    # here for free: it rejects likely_not_exploitable because the diagnosis is probe_defect,
    # but it has no view of runner_reported_no_tests at all, so an agent that instead talks
    # itself into a negative diagnosis upstream would sail through.
    payload:
      finding: {title: "OS command injection in run", cwe: "CWE-78", severity: critical,
                file_path: "lib/Runner.pm", start_line: 8}
      finding_context: {summary: "$arg is interpolated into a backticked shell command",
                        reachability: reachable,
                        reachability_rationale: "run interpolates its argument into `echo $arg`"}
      probe_execution:
        attempt: 3
        exit_code: 255
        oracle_fired: false
        precondition_reached: false
        sink_returned: false
        runner_reported_no_tests: >-
          prove: the test file emitted a zero-test plan (1..0) (matched 'skipped: (no reason
          given)'). Zero tests ran, so this is not a negative result.
        stdout_tail: "t/harness_probe.t .. skipped: (no reason given)\nResult: NOTESTS"
        stderr_tail: ""
      diagnosis: {kind: probe_defect,
                  explanation: "the runner executed no tests, so the sink was never exercised",
                  fix_hint: "give the Test::More script a plan so prove runs it"}
    facts: {environment_ready: true, oracle_fired: false, precondition_reached: false,
            last_diagnosis: probe_defect, reachability: reachable, probe_repairs_exhausted: true}
    expected: inconclusive
  - name: no_probe_was_ever_planned_on_reachable_code
    category: regression
    scenarios: [RISK-OPS-001, RISK-SEC-003]
    # probe-planner spent 287s and its entire output budget on reasoning, made zero tool calls
    # and emitted no plan, so the finding arrived at the verdict with a context and nothing
    # else. The evidence record then looks identical to `unreachable_sink_needs_no_probe`
    # above — no execution, no diagnosis — and that is the trap: there the absence of a probe
    # was a conclusion, here it is a failure. The discriminator is the context, which says
    # `reachable` with the sink cited, so the right answer is inconclusive
    # (budget_exhausted). Reading "no probe, no oracle" as absence of danger gets this wrong,
    # and `verdict_violations` agrees — likely_not_exploitable needs an unreachable sink or a
    # valid negative, and there is neither.
    payload:
      finding: {title: "SQL injection in getUser", cwe: "CWE-89", severity: high,
                file_path: "src/main/java/com/example/UserDao.java", start_line: 10}
      finding_context:
        summary: "name is concatenated into the SQL text passed to Statement.executeQuery"
        reachability: reachable
        reachability_rationale: "getUser interpolates its String argument into the query"
        sink: {file_path: "src/main/java/com/example/UserDao.java", start_line: 12, end_line: 12,
               note: "executeQuery receives a concatenated query string"}
      probe_plan: null
      probe_execution: null
      diagnosis: null
    facts: {environment_ready: true, oracle_fired: false, precondition_reached: false,
            reachability: reachable}
    expected: inconclusive
