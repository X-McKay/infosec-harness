# Tool policy for the sandbox-shell toolset (agent-playbook §5): run a shell command inside a
# fresh, isolated container of the candidate base image so an environment plan can be checked
# before the real build. Implemented in runtime/capabilities.py (run_in_sandbox).
#
# Constraints held in code, not by this file: commands never run on the worker host; the
# repository is not mounted; the container has no external network; it is discarded after the
# call. Isolation (gVisor) fails closed when unavailable. Open risk: RISK-SEC-001 in
# agents/risk-scenarios.yaml.
name: sandbox-shell
# Creates a container and executes code. Recoverable (the container is ephemeral and nothing
# outside it is touched) but not `read`: every agent enabling this toolset is at least `durable`.
effect: write_reversible
# `<run_id>:<tool_call_id>:v1` names the container deterministically, so a retried attempt is
# recognisably the same operation (see sandbox/docker.container_name).
retry_safety: idempotency_key_required
# The command deadline passed to the sandbox runner for each call.
timeout_seconds: 180
# The tool result (exit code plus stdout and stderr tails) is clipped to this.
max_output_bytes: 8000
tools:
  - name: run_in_sandbox
    effect: write_reversible
