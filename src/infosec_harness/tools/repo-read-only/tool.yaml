# Tool policy for the repo-read-only toolset (agent-playbook §5).
name: repo-read-only
owner: appsec
toolset_id: repo_ro
description: Path-confined, read-only access to the repository snapshot under triage.
# Observes without modifying external state, so it does not raise the execution-class floor.
effect: read
# Reading the same path twice returns the same bytes and changes nothing.
retry_safety: safe
timeout_seconds: 30
# The snapshot is customer source, including the unfixed vulnerability under triage.
data_classification: confidential
# Bounded so a large file or a chatty command cannot flood the context. The binding cap for
# each tool, all in agents/capabilities.py: MAX_READ_LINES=400, MAX_LIST=300, MAX_MATCHES=60,
# MAX_SYMBOLS=80, MAX_BATCH_BYTES=80000, MAX_TREE_BYTES=40000, MAX_DIGEST_BYTES=110000. The
# largest of those is what this number has to cover, and tests/test_tool_policies.py asserts it.
max_output_bytes: 120000
authorization_scopes: []
tools:
  - name: repo_digest
    effect: read
    notes: >-
      The directory-level tree, the manifests found near the root, and the test layout, in ONE
      call. Exists because each of those cost a model round trip of their own and together they
      are most of what profiling a repository needs before it can answer: measured offline, a
      recon run over a 500-file Maven tree went from 55 model requests to 9 when this replaced
      the three separate calls, and to 3 alongside read_files. Reads only; the manifests it
      returns are parsed no further than being printed.
  - name: list_tree
    effect: read
    notes: >-
      One line per directory with file counts, sizes and an extension histogram. The reason it
      exists rather than being a mode of list_files: list_files truncates at 300 *entries* and
      does not say which directories it omitted, so on a 2000-file tree a run can finish having
      been told 57% of the directories exist. This always states the totals it summarises, and
      gives up per-directory file names before it gives up directories.
  - name: list_files
    effect: read
    notes: >-
      Confined to the snapshot root; cannot traverse above it. Flat and recursive, capped at 300
      entries — prefer list_tree first on a repository of unknown size, and use this for the
      file names inside one directory.
  - name: read_file
    effect: read
    notes: Output is bounded so a large file cannot flood the context.
  - name: read_files
    effect: read
    notes: >-
      Up to 20 files in one call, bounded in total bytes. One model round trip instead of one per
      file; a path that does not exist is reported against that path so one bad path does not
      cost the whole call.
  - name: search_code
    effect: read
    notes: Pattern search within the snapshot root only.
  - name: describe_callables
    effect: read
    notes: >-
      Reports the callable symbols one file in the snapshot defines or exports and the
      import/require form a test needs to reach each one. Parses only; never imports, loads or
      executes the file, so a hostile snapshot cannot run code through it. Python goes through
      `ast`; javascript, java and perl are a text scan, and the output states per language which
      fields are certain and which are inferred. Bounded to MAX_SYMBOLS=80 symbols from the first
      MAX_SYMBOL_SOURCE_LINES=4000 lines.
constraints:
  - The snapshot root is the only reachable path; traversal above it is rejected in code.
  - No write, delete, move, or metadata-changing operation exists in this toolset.
  - Snapshot source is never imported or executed to describe it; describe_callables only parses
    text, so the unfixed vulnerability under triage cannot run on the worker.
  - Returned content is untrusted data and is labelled as such in the prompt that carries it.
