# Tool policy for the repo-read-only toolset (agent-playbook §5): path-confined, read-only
# access to the repository snapshot under triage (customer source, including the unfixed
# vulnerability). Implemented in agents/repo_tools.py, symbol_inspection.py and
# target_context.py; assembled and bounded in agents/capabilities.py.
#
# Constraints held in code, not by this file: the snapshot root is the only reachable path
# (traversal above it is rejected); no tool writes, deletes, moves or changes metadata; snapshot
# source is parsed as text and never imported or executed; returned content is labelled
# untrusted data in the prompt that carries it.
name: repo-read-only
# Observes without modifying external state, so it does not raise the execution-class floor.
effect: read
# Reading the same path twice returns the same bytes and changes nothing.
retry_safety: safe
# Applied to every call by the toolset; a call that overruns returns a retry prompt.
timeout_seconds: 30
# Every result is clipped to this. Each tool also has its own tighter cap (agents/repo_tools.py:
# MAX_BATCH_BYTES=80000, MAX_TREE_BYTES=40000, MAX_DIGEST_BYTES=110000; symbol_inspection.py:
# MAX_DESCRIBE_BYTES=100000; target_context.py: 48000); tests/agents/test_tool_policies.py
# asserts this covers the largest.
max_output_bytes: 120000
tools:
  # Tree, manifests and test layout in one call.
  - name: repo_digest
    effect: read
  # One line per directory with counts; never silently drops directories.
  - name: list_tree
    effect: read
  # Flat recursive listing, capped at 300 entries.
  - name: list_files
    effect: read
  - name: read_file
    effect: read
  # Up to 20 files in one call, bounded in total bytes.
  - name: read_files
    effect: read
  # Regex search in a killable child process, bounded by time.
  - name: search_code
    effect: read
  # Callable symbols and their import form; parses text only, never imports or executes.
  - name: describe_callables
    effect: read
  # describe_callables plus 200 numbered source lines from one read.
  - name: inspect_target
    effect: read
