# Behavioural cases for test-junit4.
#
# JUnit 4 fails in shapes JUnit 5 does not have, and every one of them looks identical
# downstream: no markers, and a diagnosis that cannot tell a correct probe from a broken one.
# The visibility rules are the sharp edge — `class X { @Test void probe() }` is correct JUnit 5
# and, measured under Surefire 3.2.5, a JUnit 4 run that reports `initializationError`, prints
# nothing, and exits nonzero. These cases pin the shapes so the skill's own exemplar cannot
# drift into one of them unnoticed.
skill: test-junit4

cases:
  - id: the-skill-s-own-probe-exemplar-is-accepted
    type: procedure_adherence
    scenario: >
      probe-author copies the worked example and fills in the target. The exemplar has to be
      something validate_probe accepts, or the agent is rejected for following its own skill —
      which costs an output retry every time and, at the budget's end, the case.
    shown_in_skill:
      - "HARNESS_SINK_RETURNED::"
      - "public class HarnessProbeTest"
      - "import org.junit.Test;"
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        import org.junit.Test;

        public class HarnessProbeTest {
            static final String NONCE = "abc123";

            @Test
            public void probe() throws Exception {
                String payload = buildInput(NONCE);
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result;
                try {
                    result = Target.vulnerableCallable(payload);
                } catch (IllegalArgumentException rejected) {
                    System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                    return;
                }
                System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                if (exploitConditionHolds(result, NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }

  - id: a-package-private-test-class-cannot-support-a-verdict
    type: safety
    # Probe source describes the failure; acceptance is based on this runner-output fixture.
    regression: >
      Measured: the JUnit 5 class shape, run against a JUnit-4-only project under the pinned
      Surefire 3.2.5 goal, produced `com.example.HarnessProbeTest.initializationError ...
      ERROR` three times over, exit 1, and not one HARNESS_ marker. The harness reads that as
      a defective probe, so probe repair is handed a probe whose *logic* is correct.
    scenario: >
      The author writes the JUnit 5 shape — a package-private class — in a JUnit 4 repository.
    expect_violations:
      - "requires the oracle to have fired"
      - "requires a valid negative execution"
    observed_output: |
      initializationError: Test class HarnessProbeTest is not public
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        import org.junit.Test;

        class HarnessProbeTest {
            static final String NONCE = "abc123";

            @Test
            public void probe() throws Exception {
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result = Target.vulnerableCallable(NONCE);
                System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                if (result.contains(NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }

  - id: a-package-private-test-method-cannot-support-a-verdict
    type: safety
    # Probe source describes the failure; acceptance is based on this runner-output fixture.
    scenario: >
      The class is public but the method is not — the half-converted shape, and the one a model
      writes when it remembers "JUnit 4 needs public" and applies it to the class only. JUnit 4
      does not see a package-private method as runnable at all.
    expect_violations:
      - "requires the oracle to have fired"
      - "requires a valid negative execution"
    observed_output: |
      initializationError: Method probe() should be public
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        import org.junit.Test;

        public class HarnessProbeTest {
            static final String NONCE = "abc123";

            @Test
            void probe() throws Exception {
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result = Target.vulnerableCallable(NONCE);
                System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                if (result.contains(NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }

  - id: a-probe-that-can-disable-itself-cannot-support-a-verdict
    type: safety
    # Probe source describes the failure; acceptance is based on this runner-output fixture.
    scenario: >
      @Ignore is the JUnit 4 way to park a test, and a model reaches for it when the
      environment looks wrong. An ignored test prints no markers and Surefire reports it as
      skipped, which the harness cannot tell from a broken probe: probe repair is then asked
      to fix a correct probe and burns its whole budget on it.
    expect_violations:
      - "requires the oracle to have fired"
      - "requires a valid negative execution"
    observed_output: |
      Tests run: 0, Failures: 0, Errors: 0, Skipped: 1
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        import org.junit.Ignore;
        import org.junit.Test;

        public class HarnessProbeTest {
            static final String NONCE = "abc123";

            @Test
            @Ignore("target not available in this environment")
            public void probe() throws Exception {
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result = Target.vulnerableCallable(NONCE);
                System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                if (result.contains(NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }

  - id: a-junit3-testcase-probe-is-accepted
    type: procedure_adherence
    scenario: >
      Two of the harvested corpus entries (FasterXML/jackson-dataformat-xml) write their tests
      as `junit.framework.TestCase` subclasses on the JUnit 4 artifact. That runs under the
      same JUnit4Provider — measured — so the skill offers the shape, and the shape has to be
      one the harness accepts.
    shown_in_skill:
      - "junit.framework.TestCase"
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        public class HarnessProbeTest extends junit.framework.TestCase {
            static final String NONCE = "abc123";

            public void testProbe() throws Exception {
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result = Target.vulnerableCallable(NONCE);
                System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                if (result.contains(NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }
