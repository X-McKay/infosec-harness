# Structural recipe cases use sandbox policy. Framework flag recommendations live
# in the skill; build and smoke execution determine whether they work.
skill: build-gradle

cases:
  - id: the-skill-s-own-recipe-is-accepted
    type: procedure_adherence
    scenario: >
      env-planner follows build-gradle for a build.gradle project.
    shown_in_skill:
      - "--tests"
      - "-i"
    environment_spec:
      base_image: gradle:8-jdk21
      install_commands:
        - ./gradlew --no-daemon testClasses
      test_command: ./gradlew --no-daemon --offline --rerun-tasks -i test --tests '*HarnessProbeTest'

  - id: a-gradle-selector-given-a-file-path-is-rejected
    type: procedure_adherence
    scenario: >
      Gradle selects by class name like Surefire does, so a path matches nothing and the run
      executes zero tests — which looks like a probe defect and is not one.
    expect_violations:
      - "one simple test class"
    environment_spec:
      base_image: gradle:8-jdk21
      test_command: ./gradlew --no-daemon --offline --rerun-tasks -i test --tests 'src/test/java/com/example/HarnessProbeTest.java'

  - id: a-gradle-command-with-no-selector-is-rejected
    type: procedure_adherence
    scenario: >
      Without a selector the command runs the project's whole suite, so the probe's result is
      buried among unrelated failures and an unrelated failing test fails the probe run.
    expect_violations:
      - "exactly one class selector"
    environment_spec:
      base_image: gradle:8-jdk21
      test_command: ./gradlew --no-daemon --offline --rerun-tasks -i test
