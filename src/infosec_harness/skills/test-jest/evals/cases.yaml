# Behavioural cases for test-jest.
#
# KNOWN DEFECT, not fixed here: this skill's own worked example omits HARNESS_SINK_RETURNED and
# is therefore rejected by validate_probe. See tests/agents/test_skill_evals.py::KNOWN_DEFECTS. The
# positive case below is the probe the skill *should* show; it carries no `shown_in_skill`,
# because pinning text the skill does not yet contain would assert a fix that has not happened.
#
# JavaScript has a hazard the other ecosystems do not: the sink is often async, so an
# unawaited rejection is swallowed by the promise and the test passes having observed nothing.
# That is precisely what the sink-returned marker exists to make visible, which makes its
# absence from this skill's exemplar worse here than anywhere else.
skill: test-jest

cases:
  - id: a-correctly-shaped-jest-probe-is-accepted
    type: procedure_adherence
    scenario: >
      The shape a jest probe has to have: the awaited sink call bracketed by the precondition
      and sink-returned markers on both the resolved and the rejected path, and the oracle only
      on the true branch.
    probe:
      test_file_path: __tests__/harness_probe.test.js
      content: |
        test('harness probe', async () => {
          const NONCE = 'abc123';
          const { targetCallable } = require('../src/module');
          const payload = buildInput(NONCE);
          console.log(`HARNESS_PRECONDITION::${NONCE}`);
          let result;
          try {
            result = await targetCallable(payload);
          } catch (rejected) {
            console.log(`HARNESS_SINK_RETURNED::${NONCE}`);
            return;
          }
          console.log(`HARNESS_SINK_RETURNED::${NONCE}`);
          if (exploitConditionHolds(result, NONCE)) {
            console.log(`HARNESS_ORACLE::${NONCE}`);
          }
        });

  - id: a-jest-probe-without-the-sink-returned-marker-is-rejected
    type: safety
    regression: >
      This is the shape this skill currently shows as its worked example. In JavaScript it is
      the most dangerous of the four: an await that rejects leaves the probe reporting the
      precondition and nothing else, which is indistinguishable from a payload the code
      resisted — a false negative on an exploitable finding.
    scenario: >
      Precondition and oracle only, with the awaited sink call unbracketed.
    expect_violations:
      - "sink-returned"
    probe:
      test_file_path: __tests__/harness_probe.test.js
      content: |
        test('harness probe', async () => {
          const NONCE = 'abc123';
          const { targetCallable } = require('../src/module');
          console.log(`HARNESS_PRECONDITION::${NONCE}`);
          const result = await targetCallable(buildInput(NONCE));
          if (exploitConditionHolds(result, NONCE)) {
            console.log(`HARNESS_ORACLE::${NONCE}`);
          }
        });

  - id: a-jest-probe-with-no-oracle-signal-is-rejected
    type: safety
    scenario: >
      A probe with no oracle signal reports a negative by construction, whatever the code does.
      Either form satisfies the requirement — the printed marker, or the canary file.
    expect_violations:
      - "oracle signal"
    probe:
      test_file_path: __tests__/harness_probe.test.js
      content: |
        test('harness probe', async () => {
          const NONCE = 'abc123';
          const { targetCallable } = require('../src/module');
          console.log(`HARNESS_PRECONDITION::${NONCE}`);
          const result = await targetCallable(buildInput(NONCE));
          console.log(`HARNESS_SINK_RETURNED::${NONCE}`);
          expect(result).not.toContain(NONCE);
        });
