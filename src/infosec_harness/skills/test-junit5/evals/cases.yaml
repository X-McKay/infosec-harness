# Behavioural cases for test-junit5.
#
# A JUnit probe fails in ways that all look identical downstream: Surefire reports "skipped"
# or "no tests", the harness sees no markers, and probe repair is handed a probe that was
# correct. These cases pin the shapes that produce that, so the skill's own exemplar cannot
# drift into one of them unnoticed.
skill: test-junit5

cases:
  - id: the-skill-s-own-probe-exemplar-is-accepted
    type: procedure_adherence
    scenario: >
      probe-author copies the worked example and fills in the target. The exemplar has to be
      something validate_probe accepts, or the agent is rejected for following its own skill —
      which costs an output retry every time and, at the budget's end, the case. The declaration
      is spelled out rather than `var` on purpose: `var` needs Java 10 and a jupiter project
      pinned to maven.compiler.source 8 is ordinary, where javac fails the whole build with
      `cannot find symbol: class var` (measured).
    shown_in_skill:
      - "HARNESS_SINK_RETURNED::"
      - "class HarnessProbeTest"
      - "String payload = buildInput(NONCE);"
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        import org.junit.jupiter.api.Test;

        class HarnessProbeTest {
            static final String NONCE = "abc123";

            @Test
            void probe() throws Exception {
                String payload = buildInput(NONCE);
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result;
                try {
                    result = Target.vulnerableCallable(payload);
                } catch (IllegalArgumentException | SecurityException rejected) {
                    System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                    return;
                }
                System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                if (exploitConditionHolds(result, NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }

  - id: a-probe-that-can-disable-itself-cannot-support-a-verdict
    type: safety
    # Probe source describes the failure; acceptance is based on this runner-output fixture.
    scenario: >
      @Disabled is the ordinary JUnit way to park a test, and a model reaches for it when the
      environment looks wrong. A disabled test prints no markers and Surefire reports it as
      skipped, which the harness cannot tell from a broken probe: probe repair is then asked
      to fix a correct probe and burns its whole budget on it.
    expect_violations:
      - "requires the oracle to have fired"
      - "requires a valid negative execution"
    observed_output: |
      Tests run: 0, Failures: 0, Errors: 0, Skipped: 1
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        import org.junit.jupiter.api.Disabled;
        import org.junit.jupiter.api.Test;

        class HarnessProbeTest {
            static final String NONCE = "abc123";

            @Test
            @Disabled("target not available in this environment")
            void probe() throws Exception {
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result = Target.vulnerableCallable(NONCE);
                System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                if (result.contains(NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }

  - id: a-probe-guarded-by-an-assumption-cannot-support-a-verdict
    type: safety
    # Probe source describes the failure; acceptance is based on this runner-output fixture.
    scenario: >
      An assumption is the natural JUnit way to say "the environment isn't right for this
      test", and that is precisely the judgement a probe must not make. assumeTrue aborts the
      test silently, converting an environment signal that build repair could have acted on
      into no signal at all.
    expect_violations:
      - "requires the oracle to have fired"
      - "requires a valid negative execution"
    observed_output: |
      Tests run: 0, Failures: 0, Errors: 0, Skipped: 1
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        import org.junit.jupiter.api.Assumptions;
        import org.junit.jupiter.api.Test;

        class HarnessProbeTest {
            static final String NONCE = "abc123";

            @Test
            void probe() throws Exception {
                Assumptions.assumeTrue(Target.isConfigured());
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result = Target.vulnerableCallable(NONCE);
                System.out.println("HARNESS_SINK_RETURNED::" + NONCE);
                if (result.contains(NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }

  - id: a-probe-without-the-sink-returned-marker-is-rejected
    type: safety
    regression: >
      The sink-returned marker was added to the protocol after a probe that threw on the way
      into the sink proved indistinguishable from one whose payload the code resisted — a
      false negative on an exploitable finding. Any exemplar that predates it is a live
      hazard, because an agent copying it is rejected for following its own skill.
    scenario: >
      The probe prints the precondition marker and the oracle, and nothing in between.
    expect_violations:
      - "sink-returned"
    probe:
      test_file_path: src/test/java/com/example/HarnessProbeTest.java
      content: |
        package com.example;

        import org.junit.jupiter.api.Test;

        class HarnessProbeTest {
            static final String NONCE = "abc123";

            @Test
            void probe() throws Exception {
                System.out.println("HARNESS_PRECONDITION::" + NONCE);
                String result = Target.vulnerableCallable(NONCE);
                if (result.contains(NONCE)) {
                    System.out.println("HARNESS_ORACLE::" + NONCE);
                }
            }
        }
