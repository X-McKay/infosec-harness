# Behavioural cases for build-maven.
#
# The static suite already checks that every command this skill *shows* is one the harness
# would accept. These cases check the complement, which is the part that decides whether that
# check means anything: that the harness would *reject* each mistake the skill exists to
# prevent. A rule nobody has ever seen fire is not a rule, it is a sentence in a file — the
# same failure `evals/inert_gates.py` was written to name.
#
# Every `expect_violations` entry below corresponds to a failure measured against the real
# corpus, and is cited in validators.py at the check that catches it.
skill: build-maven

cases:
  - id: the-skill-s-own-recipe-is-accepted-whole
    type: procedure_adherence
    scenario: >
      env-planner follows build-maven end to end for a pom.xml project: the two install
      commands, then the pinned-Surefire test command. This is the artifact a live agent
      emits, judged by every validator including the ones about coherence between install and
      test commands, which no single-command check can see.
    shown_in_skill:
      - "-Dmaven.repo.local=/work/home/.m2/repository"
      - "org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test"
    environment_spec:
      base_image: maven:3.9-eclipse-temurin-21
      install_commands:
        - mvn -B -Dmaven.repo.local=/opt/home/.m2/repository -DskipTests test-compile
        - >-
          mkdir -p src/test/java && echo 'import org.junit.jupiter.api.Test; class
          HarnessWarmupTest { @Test void warm() {} }' > src/test/java/HarnessWarmupTest.java &&
          mvn -B -Dmaven.repo.local=/opt/home/.m2/repository test-compile
          org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test -Dtest=HarnessWarmupTest &&
          rm -f src/test/java/HarnessWarmupTest.java target/test-classes/HarnessWarmupTest.class
      test_command: >-
        mvn -B -o test-compile org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test
        -Dtest=HarnessProbeTest -Dmaven.repo.local=/work/home/.m2/repository
        -Dmaven.test.redirectTestOutputToFile=false

  - id: a-test-command-without-the-probe-time-repo-local-is-rejected
    type: procedure_adherence
    regression: >
      build-maven and test-junit5 both once showed a worked example that omitted
      -Dmaven.repo.local=/work/home/.m2/repository while build-maven's own prose demanded it.
      An agent copying the example was rejected for a rule the same skill had just taught it,
      and java-sqli-vulnerable oscillated between the two until its output retries ran out and
      it recorded environment_unbuildable. The skill now calls this "the single easiest way to
      turn a correct command into a rejected one"; this case is what keeps that true.
    scenario: >
      Everything else about the command is right, which is the point — the omission is
      invisible by inspection.
    expect_violations:
      - "-Dmaven.repo.local=/work/home/.m2/repository"
    environment_spec:
      base_image: maven:3.9-eclipse-temurin-21
      test_command: >-
        mvn -B -o test-compile org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test
        -Dtest=HarnessProbeTest -Dmaven.test.redirectTestOutputToFile=false

  - id: a-quiet-maven-run-is-rejected
    type: safety
    scenario: >
      -q instead of -B. Maven relays the forked test JVM's stdout through its own logger at
      INFO, so -q raises the threshold above the probe's HARNESS_ markers: the probe runs,
      passes, and is recorded as having reached nothing. A silent false negative.
    expect_violations:
      - "Drop -q"
    environment_spec:
      base_image: maven:3.9-eclipse-temurin-21
      test_command: >-
        mvn -q -o test-compile org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test
        -Dtest=HarnessProbeTest -Dmaven.repo.local=/work/home/.m2/repository
        -Dmaven.test.redirectTestOutputToFile=false

  - id: reaching-the-test-phase-is-rejected
    type: procedure_adherence
    scenario: >
      The `test` phase also runs the pom's own Surefire 2.12.4 execution, which has no JUnit
      Platform provider and fails the build with "No tests were executed" before the pinned
      goal runs. A plugin version bound to a phase cannot be overridden from the command line,
      so naming the goal explicitly is the only fix available to an EnvironmentSpec.
    expect_violations:
      - "Remove the `test` phase"
    environment_spec:
      base_image: maven:3.9-eclipse-temurin-21
      test_command: >-
        mvn -B -o test org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test
        -Dtest=HarnessProbeTest -Dmaven.repo.local=/work/home/.m2/repository
        -Dmaven.test.redirectTestOutputToFile=false

  - id: a-warm-up-that-runs-no-test-is-rejected
    type: procedure_adherence
    regression: >
      The naive warm-up — the pinned goal with -DfailIfNoTests=false against an empty test
      tree — downloads the plugin and every one of its own dependencies, reports BUILD SUCCESS,
      and stops short of the provider, because Surefire resolves the provider lazily at
      test-execution time. The offline probe then dies on
      `surefire-junit-platform:jar:3.2.5 (absent)`: a build that exits 0 and a probe that
      reports nothing, which neither build repair nor probe repair can see the cause of.
    scenario: >
      The install command invokes the right plugin at the right version and still warms
      nothing, because nothing ran.
    expect_violations:
      - "warms the declared Surefire provider"
    environment_spec:
      base_image: maven:3.9-eclipse-temurin-21
      install_commands:
        - >-
          mvn -B -Dmaven.repo.local=/opt/home/.m2/repository test-compile
          org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test -DfailIfNoTests=false
      test_command: >-
        mvn -B -o test-compile org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test
        -Dtest=HarnessProbeTest -Dmaven.repo.local=/work/home/.m2/repository
        -Dmaven.test.redirectTestOutputToFile=false

  - id: a-selector-given-a-file-path-is-rejected
    type: procedure_adherence
    regression: >
      Measured on java-sqli-fixed: the planner wrote -Dtest={test_file}, the harness
      substituted src/test/java/com/example/UserDaoTest.java, Surefire matched no class, and
      the case burned its whole repair budget to inconclusive. Surefire and Gradle select by
      class name, so a path matches nothing and the run executes zero tests.
    scenario: >
      The JVM runner is handed the placeholder every other ecosystem's runner requires.
    expect_violations:
      - "is a file path, not a class name"
    environment_spec:
      base_image: maven:3.9-eclipse-temurin-21
      test_command: >-
        mvn -B -o test-compile org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test
        -Dtest=src/test/java/com/example/HarnessProbeTest.java
        -Dmaven.repo.local=/work/home/.m2/repository
        -Dmaven.test.redirectTestOutputToFile=false
