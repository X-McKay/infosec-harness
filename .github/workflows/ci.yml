name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: jdx/mise-action@v3
      - run: mise trust mise.toml
      - run: just bootstrap
      - run: just check
      - run: just test
      - run: just policy-self-test
      - run: just sandbox-self-test
      - run: just network-self-test
