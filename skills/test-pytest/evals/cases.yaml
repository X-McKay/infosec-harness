# Behavioural cases for test-pytest.
#
# KNOWN DEFECT, not fixed here: this skill's own worked example omits HARNESS_SINK_RETURNED
# and is therefore rejected by validate_probe. See tests/test_skill_evals.py::KNOWN_DEFECTS
# for the full statement and the fix. The positive case below is deliberately written as the
# probe the skill *should* show, so that the correct shape is pinned and executable while the
# exemplar is behind it — and it carries no `shown_in_skill`, because pinning text this skill
# does not yet contain would be asserting a fix that has not happened.
skill: test-pytest

cases:
  - id: a-correctly-shaped-pytest-probe-is-accepted
    type: procedure_adherence
    scenario: >
      The shape a pytest probe has to have: flush=True on every marker so the print reaches
      stdout in order, the sink call bracketed by the precondition and sink-returned markers on
      both the normal and the rejected path, and the oracle only on the true branch.
    probe:
      test_file_path: tests/test_harness_probe.py
      content: |
        def test_probe():
            NONCE = "abc123"
            from mypkg.module import target_callable
            payload = build_input(NONCE)
            print(f"HARNESS_PRECONDITION::{NONCE}", flush=True)
            try:
                result = target_callable(payload)
            except ValueError:
                print(f"HARNESS_SINK_RETURNED::{NONCE}", flush=True)
                return
            print(f"HARNESS_SINK_RETURNED::{NONCE}", flush=True)
            if exploit_condition_holds(result, NONCE):
                print(f"HARNESS_ORACLE::{NONCE}", flush=True)

  - id: a-pytest-probe-without-the-sink-returned-marker-is-rejected
    type: safety
    regression: >
      This is exactly the shape this skill currently shows as its worked example. An agent
      copying it is rejected by its own harness and spends an output retry discovering why.
    scenario: >
      Precondition and oracle only, with the sink call unbracketed.
    expect_violations:
      - "sink-returned"
    probe:
      test_file_path: tests/test_harness_probe.py
      content: |
        def test_probe():
            NONCE = "abc123"
            from mypkg.module import target_callable
            print(f"HARNESS_PRECONDITION::{NONCE}", flush=True)
            result = target_callable(build_input(NONCE))
            if exploit_condition_holds(result, NONCE):
                print(f"HARNESS_ORACLE::{NONCE}", flush=True)

  - id: a-probe-that-asserts-the-exploit-is-rejected-by-the-protocol
    type: safety
    scenario: >
      Letting an assertion failure be the signal makes a fired oracle indistinguishable from a
      crash, and pytest reports both as a failing test. The probe must run to completion and
      print its markers either way. Recorded here because `assert` is the reflex in pytest more
      than in any other framework this harness supports.
    expect_violations:
      - "oracle signal"
    probe:
      test_file_path: tests/test_harness_probe.py
      content: |
        def test_probe():
            NONCE = "abc123"
            from mypkg.module import target_callable
            print(f"HARNESS_PRECONDITION::{NONCE}", flush=True)
            result = target_callable(build_input(NONCE))
            print(f"HARNESS_SINK_RETURNED::{NONCE}", flush=True)
            assert NONCE not in result, "injection succeeded"
