# Behavioural cases for build-python.
#
# `pytest -s` is the whole file. Without it pytest captures stdout, the probe's oracle markers
# never reach the runner, and every Python probe reports precondition_reached=false while
# exiting 0 — which probe_diagnosis correctly calls a probe defect and probe_repair cannot fix,
# because the fault is in the EnvironmentSpec rather than the probe. Observed live: it cost a
# whole sandboxed corpus run.
skill: build-python

cases:
  - id: the-skill-s-own-recipe-is-accepted
    type: procedure_adherence
    scenario: >
      env-planner follows build-python for a requirements.txt project.
    shown_in_skill:
      - "python -m pytest -q -s {test_file}"
    environment_spec:
      base_image: python:3.12-slim
      install_commands:
        - python -m pip install --no-cache-dir --user -r requirements.txt
        - python -m pip install --no-cache-dir --user pytest
      test_command: python -m pytest -q -s {test_file}

  - id: a-pytest-command-without-s-is-rejected
    type: safety
    scenario: >
      The command is otherwise correct and the probe is correct. pytest captures stdout by
      default, so the markers land in the capture buffer and the harness records a probe that
      reached nothing — a silent false negative rather than a visible failure.
    expect_violations:
      - "disable output capture with -s"
    environment_spec:
      base_image: python:3.12-slim
      install_commands:
        - python -m pip install --no-cache-dir --user pytest
      test_command: python -m pytest -q {test_file}

  - id: a-hardcoded-test-path-is-rejected
    type: procedure_adherence
    scenario: >
      The harness writes the probe to the path its author chose and substitutes it into
      {test_file}. A hardcoded path runs a file that does not exist: pytest reports "file or
      directory not found", exits 4, and no test executes — which reads downstream as a
      defective probe and is not one.
    expect_violations:
      - "{test_file}"
    environment_spec:
      base_image: python:3.12-slim
      install_commands:
        - python -m pip install --no-cache-dir --user pytest
      test_command: python -m pytest -q -s tests/test_probe.py

  - id: an-install-that-swallows-its-own-failure-is-rejected
    type: safety
    scenario: >
      `|| true` makes a failed dependency install invisible: the image builds, the smoke test
      passes, and the absence surfaces at probe time as an import error inside the probe —
      past build repair, the only stage that could have installed anything.
    expect_violations:
      - "failure-swallowing suffix"
    environment_spec:
      base_image: python:3.12-slim
      install_commands:
        - python -m pip install --no-cache-dir --user -r requirements.txt || true
      test_command: python -m pytest -q -s {test_file}
