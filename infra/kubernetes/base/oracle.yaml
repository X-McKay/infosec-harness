apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-oracle
  namespace: infosec-harness-lab
  labels:
    app.kubernetes.io/name: synthetic-oracle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-oracle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-oracle
        harness.infosec.example/role: oracle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oracle
          image: alpine@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
          command:
            - /bin/sh
            - -c
            - >-
              while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 36\r\nConnection: close\r\n\r\ninfosec-harness synthetic oracle v1\n' | nc -l -p 8080; done
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            limits: {cpu: "250m", memory: "64Mi", ephemeral-storage: "32Mi"}
            requests: {cpu: "50m", memory: "32Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: synthetic-oracle
  namespace: infosec-harness-lab
spec:
  selector:
    app.kubernetes.io/name: synthetic-oracle
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-probe-to-oracle
  namespace: infosec-harness-lab
spec:
  podSelector:
    matchLabels:
      harness.infosec.example/role: oracle
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              harness.infosec.example/role: approved-probe
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-probe-egress
  namespace: infosec-harness-lab
spec:
  podSelector:
    matchLabels:
      harness.infosec.example/role: approved-probe
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              harness.infosec.example/role: oracle
      ports:
        - protocol: TCP
          port: 8080
