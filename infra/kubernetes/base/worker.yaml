apiVersion: v1
kind: ServiceAccount
metadata:
  name: noexec-worker
  namespace: infosec-harness-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: noexec-worker-self-test
  namespace: infosec-harness-lab
  labels:
    app.kubernetes.io/name: noexec-worker-self-test
spec:
  serviceAccountName: noexec-worker
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: worker
      image: alpine:3.19
      command: ["/bin/sh", "-c", "test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token && sleep 2"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities: {drop: ["ALL"]}
        seccompProfile: {type: RuntimeDefault}
      resources:
        limits: {cpu: "500m", memory: "128Mi", ephemeral-storage: "64Mi"}
        requests: {cpu: "100m", memory: "64Mi"}
