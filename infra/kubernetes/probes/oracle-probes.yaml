apiVersion: batch/v1
kind: Job
metadata:
  name: synthetic-approved-probe
  namespace: infosec-harness-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        harness.infosec.example/role: approved-probe
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: alpine@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
          env:
            - name: ORACLE_CLUSTER_IP
              valueFrom:
                configMapKeyRef:
                  name: synthetic-oracle-target
                  key: cluster_ip
          command: ["/bin/sh", "-c", "wget -qO- --timeout=5 http://$ORACLE_CLUSTER_IP:8080/ | grep -qx 'infosec-harness synthetic oracle v1'"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            limits: {cpu: "250m", memory: "64Mi", ephemeral-storage: "32Mi"}
            requests: {cpu: "50m", memory: "32Mi"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: synthetic-denied-probe
  namespace: infosec-harness-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        harness.infosec.example/role: denied-probe
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: alpine@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
          env:
            - name: ORACLE_CLUSTER_IP
              valueFrom:
                configMapKeyRef:
                  name: synthetic-oracle-target
                  key: cluster_ip
          command: ["/bin/sh", "-c", "! wget -qO- --timeout=5 http://$ORACLE_CLUSTER_IP:8080/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            limits: {cpu: "250m", memory: "64Mi", ephemeral-storage: "32Mi"}
            requests: {cpu: "50m", memory: "32Mi"}
