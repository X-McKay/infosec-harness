server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { add_header Cache-Control "no-store" always; proxy_pass http://api:8000; proxy_set_header Host $host; }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location / { try_files $uri $uri/ /index.html; }  # SPA fallback
}
