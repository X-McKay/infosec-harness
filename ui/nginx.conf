# Included in nginx's http context (conf.d/default.conf).
# Cache policy lives in one map so every location inherits the server-level headers below;
# a location-level add_header would silently drop them.
map $uri $harness_cache_control {
  ~^/api/        "no-store";
  /index.html    "no-store";
  ~^/assets/     "public, max-age=31536000, immutable";
  default        "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;

  add_header Cache-Control $harness_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }  # SPA fallback
}
