[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infosec-harness"
version = "0.1.0"
description = "Bounded, replayable SARIF triage harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
anthropic = ["anthropic>=0.80,<1"]

[dependency-groups]
dev = ["pytest>=8.0,<9", "ruff>=0.15,<0.16"]

[project.scripts]
infosec-harness = "infosec_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infosec_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
