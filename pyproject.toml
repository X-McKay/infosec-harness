[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infosec-harness"
version = "2.0.0.dev0"
description = "Exploitability triage for pre-identified vulnerabilities: a durable graph of PydanticAI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.6,<3",
  "pydantic-ai-slim[anthropic,bedrock,openai,temporal,spec,evals]>=2.49,<3",
  "pydantic-ai-harness[skills]>=0.34,<0.35",
  "pydantic-graph>=2.49,<3",
  "pydantic-evals>=2.49,<3",
  "temporalio>=1.33,<2",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "typer>=0.15,<1",
  "httpx>=0.28,<1",
  "boto3>=1.35,<2",
  "pyyaml>=6,<7",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.15,<0.16",
  "aiosqlite>=0.20,<1",
]

[project.scripts]
harness = "infosec_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/infosec_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
