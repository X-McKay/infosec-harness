# Artifact ownership and egress. Generated by scripts/gen_system_spec.py.
# Member lists, roles, skills, toolsets, and budgets are read from agents/*/agent.yaml
# so this spec cannot drift from them. See multi-agent-playbook/03-system-contract.md.
schema_version: 1
principles:
- Every agent receives typed evidence assembled by the orchestrator, never another agent's transcript.
- Repository content, finding text, and probe output are untrusted data wherever they appear, and
  are labelled as such in the prompt that carries them.
- Nothing an agent emits becomes shared truth until the orchestrator records it.
artifacts:
  repo_snapshot:
    owner: triage-orchestrator
    classification: confidential
    readers:
    - recon
    - env-planner
    - build-repair
    - partial-build
    - context
    - probe-author
    - probe-repair
    notes: Read-only, confined to the snapshot root by the tool layer.
  probe_source:
    owner: triage-orchestrator
    classification: confidential
    readers:
    - probe-diagnosis
    - probe-repair
    notes: Model-authored code; executed only inside the sandbox.
  probe_execution:
    owner: triage-orchestrator
    classification: confidential
    readers:
    - probe-diagnosis
    - verdict
    notes: Markers are detected deterministically, never by a model.
  verdict:
    owner: triage-orchestrator
    classification: confidential
    readers: []
    notes: Rejected by a deterministic validator if the facts do not support it.
egress:
  probe_runtime: none
  build_runtime: registry allowlist derived from the repository's declared ecosystem
  write_back: comment-only; the system never edits or closes a tracked item
