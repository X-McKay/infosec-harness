# Dispatch budgets and retry policy. Generated by scripts/gen_system_spec.py.
# Member lists, roles, skills, toolsets, and budgets are read from agents/*/agent.yaml
# so this spec cannot drift from them. See multi-agent-playbook/03-system-contract.md.
schema_version: 1
defaults:
  recursive_delegation: false
  share_parent_history: false
  forward_credentials: false
  require_tenant_binding: false
  reserve_budget_before_dispatch: true
interactions:
  dispatch-intake:
    callers:
    - triage-orchestrator
    callees:
    - intake
    mode: dispatch
    authorization_scopes_max: []
    data_classification_max: confidential
    budget:
      max_requests: 4
      max_tool_calls: 6
      max_input_tokens: 20000
      max_output_tokens: 64000
      max_cost_usd: 0.25
    retry:
      maximum_attempts: 3
      retryable_failures:
      - transient_provider
      - transient_dependency
      non_retryable_failures:
      - invalid_input
      - policy_blocked
      - budget_exhausted
    failure:
      required: false
      on_failure: escalate
  dispatch-recon:
    callers:
    - triage-orchestrator
    callees:
    - recon
    mode: dispatch
    authorization_scopes_max: []
    data_classification_max: confidential
