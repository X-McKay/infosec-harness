# Termination and conflict rules. Generated by scripts/gen_system_spec.py.
# Member lists, roles, skills, toolsets, and budgets are read from agents/*/agent.yaml
# so this spec cannot drift from them. See multi-agent-playbook/03-system-contract.md.
schema_version: 1
owner: triage-orchestrator
rules:
- id: verdict-reached
  when: the verdict agent returns a contract-valid verdict
  outcome: complete
- id: unreachable-by-context
  when: context cites code making the sink unreachable
  outcome: complete
  verdict: likely_not_exploitable
  notes: 'Early exit: no probe is built.'
- id: test-or-vendored
  when: the finding is in test or vendored code
  outcome: complete
  verdict: likely_not_exploitable
- id: probe-unrepairable
  when: probe repairs are exhausted and the last diagnosis is probe_defect
  outcome: complete
  verdict: inconclusive
- id: environment-unbuildable
  when: the build and its repairs fail, including the partial-build fallback
  outcome: complete
  verdict: inconclusive
- id: budget-exhausted
  when: a member exceeds its declared run budget
  outcome: stop
  verdict: inconclusive
- id: contract-unsatisfiable
  when: the verdict agent cannot satisfy the evidence contract within its retries
  outcome: stop
  verdict: inconclusive
  notes: Implemented in graph/triage.py; inconclusive is what the contract reserves.
conflict:
  authority: triage-orchestrator
  policy: The deterministic verdict contract is the arbiter. Where a model's conclusion and the
    recorded facts disagree, the facts win and the verdict is rejected; the system never resolves
    a conflict by preferring the more confident agent.
escalation:
  state: inconclusive
  notes: 'inconclusive is a first-class outcome, not a failure: it is how the absence of evidence
    is reported rather than being rounded to ''not exploitable''.'
