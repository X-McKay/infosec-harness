interactions:
- id: dispatch-intake
  from: triage-orchestrator
  to: intake
  mode: dispatch
  input_schema: TriageState
  output_schema: ExtractedFinding
  policy: policies/delegation.yaml#dispatch-intake
  max_calls: 1
  timeout_seconds: 300
  purpose: normalize a free-text report into typed finding fields
- id: dispatch-recon
  from: triage-orchestrator
  to: recon
  mode: dispatch
  input_schema: TriageState
  output_schema: RepoProfile
  policy: policies/delegation.yaml#dispatch-recon
  max_calls: 1
  timeout_seconds: 300
  purpose: profile the repository once per repo@revision
- id: dispatch-env-planner
  from: triage-orchestrator
  to: env-planner
  mode: dispatch
  input_schema: TriageState
  output_schema: EnvironmentSpec
  policy: policies/delegation.yaml#dispatch-env-planner
  max_calls: 1
  timeout_seconds: 300
  purpose: plan the build and test environment
- id: dispatch-build-repair
  from: triage-orchestrator
  to: build-repair
  mode: dispatch
  input_schema: TriageState
  output_schema: EnvironmentSpec
  policy: policies/delegation.yaml#dispatch-build-repair
  max_calls: 6
  timeout_seconds: 900
  purpose: repair a failed build, up to the repair budget
- id: dispatch-partial-build
  from: triage-orchestrator
  to: partial-build
  mode: dispatch
  input_schema: TriageState
  output_schema: EnvironmentSpec
  policy: policies/delegation.yaml#dispatch-partial-build
  max_calls: 4
  timeout_seconds: 900
  purpose: narrow scope after full-build repairs are exhausted
- id: dispatch-context
  from: triage-orchestrator
  to: context
  mode: dispatch
  input_schema: TriageState
  output_schema: FindingContext
  policy: policies/delegation.yaml#dispatch-context
  max_calls: 1
  timeout_seconds: 300
  purpose: collect the code evidence and decide reachability
- id: dispatch-probe-planner
  from: triage-orchestrator
  to: probe-planner
  mode: dispatch
  input_schema: TriageState
  output_schema: ProbePlan
  policy: policies/delegation.yaml#dispatch-probe-planner
  max_calls: 1
  timeout_seconds: 300
  purpose: choose the exploit hypothesis and the oracle
- id: dispatch-probe-author
  from: triage-orchestrator
  to: probe-author
  mode: dispatch
  input_schema: TriageState
  output_schema: ProbeSource
  policy: policies/delegation.yaml#dispatch-probe-author
  max_calls: 1
  timeout_seconds: 300
  purpose: write the probe for the plan
- id: dispatch-probe-repair
  from: triage-orchestrator
  to: probe-repair
  mode: dispatch
  input_schema: TriageState
  output_schema: ProbeSource
  policy: policies/delegation.yaml#dispatch-probe-repair
  max_calls: 3
  timeout_seconds: 300
  purpose: repair a defective probe, up to the repair budget
- id: dispatch-probe-diagnosis
  from: triage-orchestrator
  to: probe-diagnosis
  mode: dispatch
  input_schema: TriageState
  output_schema: ProbeDiagnosis
  policy: policies/delegation.yaml#dispatch-probe-diagnosis
  max_calls: 4
  timeout_seconds: 300
  purpose: classify what the probe execution means
- id: dispatch-verdict
  from: triage-orchestrator
  to: verdict
  mode: dispatch
  input_schema: TriageState
  output_schema: Verdict
  policy: policies/delegation.yaml#dispatch-verdict
  max_calls: 1
  timeout_seconds: 300
  purpose: weigh the evidence into a three-way verdict
limits:
  max_agent_runs: 24
  max_delegation_depth: 0
  max_parallel_agents: 1
  max_rounds: 1
  max_model_requests: 302
  max_tool_calls: 1180
  max_input_tokens: 3390000
  max_output_tokens: 4832000
  max_cost_usd: 23.75
  deadline_seconds: 3600
state:
  owner: triage-orchestrator
  shared_memory: none
  artifact_policy: policies/data-flow.yaml
  conflict_policy: policies/termination.yaml#conflict
termination:
  policy: policies/termination.yaml
  success_states:
  - potentially_exploitable
  - likely_not_exploitable
  - inconclusive
  escalation_state: inconclusive
