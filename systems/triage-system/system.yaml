# The triage system's composition. Generated by scripts/gen_system_spec.py.
# Member lists, roles, skills, toolsets, and budgets are read from agents/*/agent.yaml
# so this spec cannot drift from them. See multi-agent-playbook/03-system-contract.md.
name: triage-system
description: 'Triage pre-identified vulnerability findings for exploitability: profile the repository,
  build it, author and run a unit-test probe in an isolated sandbox, and return a three-way verdict
  decided from a deterministic oracle signal.'
metadata:
  contract_version: 1
  owner: appsec
  operational_owner: appsec
  version: 1.0.0
  execution_class: durable
  governance_tier: critical
  risk_assessment: docs/risk-assessments/systems/triage-system.yaml
  threat_model: docs/threat-models/triage-system.md
  evaluation_policy: evals/systems/triage-system/release-policy.yaml
  data_classification: confidential
  temporal_enabled: true
justification:
  decision_owner: appsec
  review_by: '2026-12-26'
  claimed_benefits:
  - 'Capability isolation: only the environment agents may run shell commands in the sandbox, and
    only the probe agents author executed code. A single agent holding every tool would put code
    execution behind every prompt.'
  - 'Context segregation: the verdict is decided by an agent that never sees the repository, only
    the recorded evidence, so it cannot substitute an impression of the code for the oracle signal.'
  - 'Independent review: probe-diagnosis judges an execution without having written the probe, which
    is what lets a defective probe be told apart from a genuine negative.'
  - 'Separately governed responsibilities: the agents that determine executed code carry a critical
    governance tier and their own controls; the analysis agents do not.'
  baseline: A single conforming agent holding every skill and tool, prompted to triage a finding
    end to end and emit the same Verdict, scored on the same corpus with the same deterministic
    oracle and verdict contract.
  evidence: artifacts/evals/triage-system/admission.json
  success_measures:
  - The multi-agent system's false-negative rate on truly-exploitable corpus cases is no worse than
    the single-agent baseline's, with the sandbox enabled.
  - Cost per correct verdict is within 2x of the baseline's; the isolation benefits are worth a
    premium but not an unbounded one.
  - 'The baseline cannot claim potentially_exploitable without an oracle signal any more often than
    the system does (expected: neither can, since the contract is deterministic in both).'
topology:
  type: programmatic_pipeline
  orchestrator: triage-orchestrator
  dynamic_membership: false
  recursive_delegation: false
  conflict_policy: policies/termination.yaml#conflict
