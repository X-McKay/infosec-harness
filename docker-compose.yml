# Full local stack (D11). `docker compose up` runs Postgres, Temporal (+UI), an S3 store (RustFS),
# an OpenTelemetry collector + Jaeger, the worker, the API, and the React web app.
#
# Model access: set HARNESS_MODEL_MODE=live plus a backend. For Bedrock, mount ~/.aws and
# set AWS_PROFILE (run `aws sso login` on the host first). For an OpenAI-spec endpoint,
# set HARNESS_MODEL_BACKEND=gateway and HARNESS_OPENAI_API_KEY. Default here is stub, so
# the stack runs end-to-end with no credentials.
#
# Probe sandbox: the worker drives the host Docker daemon via the mounted socket. gVisor
# (runsc) is the default runtime in production; set HARNESS_SANDBOX_RUNTIME=runc for a host
# without gVisor installed.
#
# Every image is pinned by version and digest (tests/development/test_dev_experience.py).

x-backend-env: &backend-env
  HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@postgres:5432/harness
  HARNESS_TEMPORAL_ADDRESS: temporal:7233
  HARNESS_S3_ENDPOINT: http://minio:9000
  HARNESS_S3_ACCESS_KEY: harness
  HARNESS_S3_SECRET_KEY: harness12345
  HARNESS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  HARNESS_MODEL_MODE: ${HARNESS_MODEL_MODE:-stub}
  HARNESS_MODEL_BACKEND: ${HARNESS_MODEL_BACKEND:-bedrock}
  HARNESS_SANDBOX_RUNTIME: ${HARNESS_SANDBOX_RUNTIME:-runsc}
  HARNESS_OPENAI_API_KEY: ${HARNESS_OPENAI_API_KEY:-}
  AWS_PROFILE: ${AWS_PROFILE:-}
  HARNESS_BUILD_EGRESS_PROXY: ${HARNESS_BUILD_EGRESS_PROXY:-http://egress-proxy:3128}
  HARNESS_ALLOW_INSECURE_RUNTIME: ${HARNESS_ALLOW_INSECURE_RUNTIME:-false}

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_MULTIPLE: harness,temporal,temporal_visibility
    ports: ["${HARNESS_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: harness
      POSTGRES_PWD: harness
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports: ["${HARNESS_TEMPORAL_PORT:-7233}:7233"]

  temporal-ui:
    image: temporalio/ui:2.34.0@sha256:cb17ea423d76a8a19a269d0bcd81fc12eee1f6365acd2a56b590dafb35696a95
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["${HARNESS_TEMPORAL_UI_PORT:-8233}:8080"]

  # S3-compatible artifact store. The service keeps its `minio` name (the backend's endpoint and
  # ./dev's ports refer to it); minio/minio images are no longer published, so it runs RustFS,
  # which serves the same S3 API, console port and /minio/health/ready probe.
  minio:
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858
    command: ["rustfs"]
    environment:
      RUSTFS_ACCESS_KEY: harness
      RUSTFS_SECRET_KEY: harness12345
    ports: ["${HARNESS_MINIO_PORT:-9000}:9000", "${HARNESS_MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1@sha256:d2da12c4336a79758826700be9e21ecf4a9f7d945b7f8a58ba55ee3fa45427c8
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.63.0@sha256:fd5697c37ba041a91cfca1d62621d32cdeb2041c0febc2f1579e5bac6f21e34b
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["${HARNESS_JAEGER_PORT:-16686}:16686"]

  worker:
    build: .
    command: ["harness", "worker"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_started}
    environment: *backend-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace:/workspace
      - ${HOME}/.aws:/root/.aws:ro

  api:
    build: .
    command: ["sh", "-c", "harness migrate && harness api --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: {condition: service_healthy}
    environment: *backend-env
    ports: ["${HARNESS_API_PORT:-8000}:8000"]

  web:
    build: ./ui
    depends_on: [api]
    ports: ["${HARNESS_WEB_PORT:-8080}:${HARNESS_WEB_TARGET_PORT:-80}"]

  # Allowlisting forward proxy for build-time egress (D14). The build routes all network
  # through this; it forwards only to allowlisted registry hosts and denies the rest.
  # ACL seeded with the ecosystem defaults; add internal Artifactory/Nexus hosts here.
  egress-proxy:
    # 6.6-24.04_beta is the image `latest` resolved to when this stack was verified.
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes: ["./deploy/squid-allowlist.conf:/etc/squid/conf.d/allowlist.conf:ro"]
    expose: ["3128"]

volumes:
  pgdata:
  miniodata:
  workspace:
