# Local control plane. Temporal owns persistence. Run the trusted worker with
# `./dev worker` using an explicit native OpenShell runtime configuration.
services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${HARNESS_POSTGRES_PASSWORD:?Run ./dev to generate local
        credentials}
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U harness
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    runtime: runc
  temporal:
    image: temporalio/auto-setup:1.25.2@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: harness
      POSTGRES_PWD: ${HARNESS_POSTGRES_PASSWORD:?Run ./dev first}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
    - 127.0.0.1:${HARNESS_TEMPORAL_PORT:-7233}:7233
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    runtime: runc
  temporal-ui:
    image: temporalio/ui:2.34.0@sha256:cb17ea423d76a8a19a269d0bcd81fc12eee1f6365acd2a56b590dafb35696a95
    depends_on:
    - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
    - 127.0.0.1:${HARNESS_TEMPORAL_UI_PORT:-8233}:8080
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    runtime: runc
  api:
    build: .
    command:
    - harness
    - api
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    depends_on:
    - temporal
    environment:
      HARNESS_TEMPORAL_ADDRESS: temporal:7233
    ports:
    - 127.0.0.1:${HARNESS_API_PORT:-8000}:8000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    runtime: runc
  web:
    build: ./ui
    depends_on:
    - api
    ports:
    - 127.0.0.1:${HARNESS_WEB_PORT:-8080}:${HARNESS_WEB_TARGET_PORT:-80}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    runtime: runc
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes:
    - ./deploy/squid-allowlist.conf:/etc/squid/conf.d/allowlist.conf:ro
    expose:
    - '3128'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    runtime: runc
volumes:
  pgdata: null
